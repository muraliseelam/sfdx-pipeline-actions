name: Promote on label (deploy:qa / deploy:stage)

# Thin caller — label-driven qa/stage promotion, orchestrated FROM the int PR.
#
# The int PR is the control surface. After the change is deployed to int and the
# int PR is merged, a developer adds `deploy:qa` (then later `deploy:stage`) to
# that same PR. This hands off to the central orchestrator, which auto-creates
# the feature→<env> PR, deploys the delta to the <env> org, and merges it ONLY
# after a clean deploy — stamping `deployed:<env>` back on the int PR. Merge
# conflicts (or deploy failures) are surfaced right here on the int PR with a
# link to the env PR, and the `deploy:<env>` label is removed so it can be
# re-added once resolved.
#
# Everything up to and including int stays in deploy.yml; this only covers the
# qa/stage hops. Labeling a merged/closed PR still fires `pull_request: labeled`.
on:
  pull_request:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write
  deployments: write
  statuses: write
  issues: write

jobs:
  promote:
    if: >-
      github.event.label.name == 'deploy:qa' ||
      github.event.label.name == 'deploy:stage'
    uses: your-org/sfdx-pipeline-actions/.github/workflows/sf-promote-label.yml@v1
    secrets: inherit
    with:
      control_pr: ${{ github.event.pull_request.number }}
      target_env: ${{ github.event.label.name == 'deploy:qa' && 'qa' || 'stage' }}
      head_ref: ${{ github.event.pull_request.head.ref }}
      head_sha: ${{ github.event.pull_request.head.sha }}

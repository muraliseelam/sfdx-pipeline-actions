name: Sync Environment Branches

# Merges the production baseline into every environment branch so the chain
# never drifts behind production; a branch that conflicts gets a PR cut from the
# baseline instead. The production release train realigns the branches itself
# after go-live; this caller exists so you can also run it on a schedule, by hand
# after a hotfix that landed straight on the baseline, or to resolve a branch the
# release left as is because of conflicts.
#
# Branch names come from pipeline.config.yml — nothing to configure here.

on:
  workflow_dispatch:
  # Uncomment to keep the branches in step automatically.
  # schedule:
  #   - cron: "0 6 * * 1"   # Mondays, 06:00 UTC

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    uses: muraliseelam/sfdx-pipeline-actions/.github/workflows/sync-env-branches.yml@v1
    secrets: inherit

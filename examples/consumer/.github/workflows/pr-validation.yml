name: PR Validation

# Check-only validation for a feature PR into the entry branch (int).
# On open/update it runs a CHECK-ONLY validation deploy against acmeint and
# posts ONE unified report (changed components + Apex code coverage + pass/fail)
# so a reviewer can see the change is deployable BEFORE approving. NOTHING is
# deployed here — the real deploy happens later when a dev adds the deploy:int
# label (after approval). All behavior is driven by sf-pipeline/pipeline.config.yml.
on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
    branches:
      - int   # entry stage — the ONLY stage that runs check-only validation + coverage.
              # qa/stage deploy on approval with NO validation and NO Apex tests
              # (int already validated the change); their only gate is the ordering
              # guard (predecessor deployed for this commit) + PR approval.

permissions:
  contents: write
  pull-requests: write
  deployments: write
  statuses: write

# NOTE: do NOT set a `concurrency` group here that can equal the reusable's own
# group (the reusable uses `pr-validation-<pr-number>`). A caller that shares a
# concurrency group with the child reusable it invokes cancels/deadlocks itself,
# producing a run with 0 jobs. Concurrency is owned by the reusable workflow.

jobs:
  validate:
    uses: your-org/sfdx-pipeline-actions/.github/workflows/pr-validation.yml@v1
    secrets: inherit

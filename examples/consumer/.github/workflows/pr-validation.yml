name: PR Validation

# Check-only validation for a feature PR into the entry branch (int).
# On open/update it runs a CHECK-ONLY validation deploy against acmeint and
# posts ONE unified report (changed components + Apex code coverage + pass/fail)
# so a reviewer can see the change is deployable BEFORE approving. NOTHING is
# deployed here — the real deploy happens later when a dev adds the deploy:int
# label (after approval). All behavior is driven by sf-pipeline/pipeline.config.yml.
on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
    branches:
      # ─────────────────────────────────────────────────────────────────────
      #  THE ONE VALUE YOU MUST EDIT OUTSIDE pipeline.config.yml.
      #  Set this to environments[0].branch — your ENTRY branch.
      #  GitHub parses `on:` filters before any job runs, so this filter
      #  cannot read the config file. Every other branch and environment name
      #  in the whole pipeline comes from pipeline.config.yml.
      # ─────────────────────────────────────────────────────────────────────
      - dev
      # Also validate PRs into a release branch. The production release train
      # cuts these, and plan.py validates them against `prod-validate` (the
      # check-only environment). Match `production.release_branch_prefix`.
      # Project Init lets only the production branch use `prod-validate`, so
      # such a validation is refused at that environment (User Guide, Part 5);
      # the release train validates production itself.
      - "release/**"
      # The entry stage is the ONLY stage that runs check-only validation plus
      # the coverage gate. Later stages deploy on approval with no re-validation
      # and no Apex tests (the entry stage already validated the change); their
      # gate is the ordering guard (predecessor deployed for this commit) plus
      # the PR approval.

permissions:
  contents: write
  pull-requests: write
  deployments: write
  statuses: write

# NOTE: do NOT set a `concurrency` group here that can equal the reusable's own
# group (the reusable uses `pr-validation-<pr-number>`). A caller that shares a
# concurrency group with the child reusable it invokes cancels/deadlocks itself,
# producing a run with 0 jobs. Concurrency is owned by the reusable workflow.

jobs:
  validate:
    uses: muraliseelam/sfdx-pipeline-actions/.github/workflows/pr-validation.yml@v1
    secrets: inherit

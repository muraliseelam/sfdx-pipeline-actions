name: "Pre-deploy guards"
description: >-
  Block a deploy that shouldn't happen. Three checks, each fatal:
    1. Merge-conflict — the PR must merge cleanly into its target env branch.
    2. Ordering — every earlier stage (require_envs, else require_env) must
       already be deployed for THIS commit (qa needs int; stage needs int AND qa).
    3. Validation — the entry stage requires a green `pr-validation` status
       (skipped when an admin bypass is active).
  On any failure the action comments on the PR and fails the job.

inputs:
  pr_number:
    required: true
  base_ref:
    description: "Target env branch the PR merges into."
    required: true
  head_sha:
    required: true
  env_name:
    required: true
  require_env:
    description: "Predecessor stage that must be deployed for this commit (blank = entry)."
    required: false
    default: ""
  require_envs:
    description: "Comma-separated earlier stages that must ALL be deployed for this commit. Overrides require_env."
    required: false
    default: ""
  is_entry:
    description: "true when this is the entry stage."
    required: false
    default: "false"
  bypass_active:
    required: false
    default: "false"
  github_token:
    required: true

runs:
  using: composite
  steps:
    - name: Merge-conflict precheck
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        REPO: ${{ github.repository }}
        PR: ${{ inputs.pr_number }}
        ENVN: ${{ inputs.env_name }}
        BASE: ${{ inputs.base_ref }}
      run: |
        set -uo pipefail
        state=""
        for i in 1 2 3 4 5 6 7 8; do
          state=$(gh pr view "$PR" --repo "$REPO" --json mergeable -q .mergeable 2>/dev/null || echo "")
          case "$state" in MERGEABLE|CONFLICTING) break ;; esac
          echo "mergeable='$state' (still computing) — retrying..."; sleep 5
        done
        if [ "$state" = "CONFLICTING" ]; then
          gh pr comment "$PR" --repo "$REPO" --body \
            "⛔ **Cannot deploy to \`$ENVN\`** — this PR has **merge conflicts** with \`$BASE\`. Merge/rebase \`$BASE\` into your feature branch, resolve, then re-approve."
          echo "::error::PR #$PR conflicts with $BASE."
          exit 1
        fi
        echo "No merge conflicts with $BASE (mergeable='$state')."

    - name: Ordering guard
      if: ${{ inputs.require_envs != '' || inputs.require_env != '' }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        REPO: ${{ github.repository }}
        NEEDED_ENVS: ${{ inputs.require_envs || inputs.require_env }}
        SHA: ${{ inputs.head_sha }}
        ENVN: ${{ inputs.env_name }}
        PR: ${{ inputs.pr_number }}
      run: |
        set -uo pipefail
        # Trust ONLY the durable `deploy-<env>` commit status, which is written
        # exclusively by a REAL deploy (deploy.yml, after the org deploy succeeds).
        # Check-only PR validation never sets it, so a lingering phantom
        # "deployment" record from a validation run can't satisfy this guard.
        # Every earlier stage must have it: stage needs int AND qa, not just qa.
        missing=""
        for REQ_ENV in ${NEEDED_ENVS//,/ }; do
          state=$(gh api "repos/$REPO/commits/$SHA/status" \
            --jq '.statuses[] | select(.context=="deploy-'"$REQ_ENV"'") | .state' 2>/dev/null | tail -n1 || echo "")
          if [ "$state" = "success" ]; then
            echo "Ordering guard: '$REQ_ENV' really deployed for ${SHA:0:8} (deploy-$REQ_ENV=success)."
          else
            missing="${missing:+$missing, }$REQ_ENV (deploy-$REQ_ENV=${state:-missing})"
          fi
        done
        if [ -z "$missing" ]; then
          echo "Ordering guard passed for '$ENVN'."
          exit 0
        fi
        state="$missing"; REQ_ENV="${NEEDED_ENVS//,/, }"
        gh pr comment "$PR" --repo "$REPO" --body \
          "⛔ **Cannot deploy to \`$ENVN\`** — commit \`${SHA:0:8}\` must be deployed to every earlier stage first (\`$REQ_ENV\`). Not deployed yet: $state."
        echo "::error::'$ENVN' blocked — commit ${SHA:0:8} is not deployed to: $state."
        exit 1

    - name: Validation gate (entry stage)
      if: ${{ inputs.is_entry == 'true' && inputs.bypass_active != 'true' }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        REPO: ${{ github.repository }}
        SHA: ${{ inputs.head_sha }}
        ENVN: ${{ inputs.env_name }}
        PR: ${{ inputs.pr_number }}
      run: |
        set -uo pipefail
        state=$(gh api "repos/$REPO/commits/$SHA/status" \
          --jq '.statuses[] | select(.context=="pr-validation") | .state' 2>/dev/null | tail -n1 || echo "")
        if [ "$state" != "success" ]; then
          gh pr comment "$PR" --repo "$REPO" --body \
            "⛔ **Cannot deploy to \`$ENVN\`** — PR Validation isn't green for \`${SHA:0:8}\` (\`pr-validation\`=\`${state:-missing}\`). Wait for the validation report, then re-approve."
          echo "::error::'$ENVN' blocked — pr-validation='${state:-missing}' for $SHA."
          exit 1
        fi
        echo "Validation gate passed — pr-validation=success for $SHA."

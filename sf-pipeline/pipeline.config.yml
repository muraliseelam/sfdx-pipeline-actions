# =============================================================================
# Salesforce DevOps Pipeline: the only file you need to edit
# -----------------------------------------------------------------------------
# 1. List your environments below, in promotion order. That's the only
#    required change: everything else defaults from the names.
# 2. python sf-pipeline/scripts/bootstrap.py github   (branches, labels, protection)
# 3. python sf-pipeline/scripts/bootstrap.py secrets  (org logins -> GitHub secrets)
# Validate any edit with:  python sf-pipeline/scripts/pipeline_config.py validate
# =============================================================================
version: 1

# ----------------------------------------------------------------------------
# Environments, in promotion order. Feature PRs enter at the first one; the
# last one is production. Use {} to take every default. Any key can be set:
#
#   branch:             <name>  (production: project.baseline_branch)
#   org_alias:          <name>
#   auth_method:        auth.method (sfdx_url | jwt)
#   secrets:            auth_url:     SF_<NAME>_AUTH_URL       (sfdx_url)
#                       username:     SF_<NAME>_USERNAME       (jwt)
#                       consumer_key: SF_<NAME>_CONSUMER_KEY   (jwt)
#                       jwt_key:      SF_<NAME>_JWT_KEY        (jwt)
#   instance_url:       https://test.salesforce.com (production: https://login.salesforce.com)
#   status_check:       deploy-<name>
#   test_policy:        specified (production: local)
#                         specified = RunSpecifiedTests from changed classes' test classes
#                         local     = RunLocalTests
#                         canary    = specified + canary_tests (always-run smoke suite)
#                         none      = NoTestRun (sandboxes only)
#   canary_tests:       []
#   required_approvals: approvals.required_reviews
#   github_environment: sf-<name>  (production: production)
#   sync_after_release: true (production: false)
#   jira_status:        ""   Jira status to move linked stories to after a deploy
#   production:         true on one env only if it isn't the last one listed
#
# Four stages? Delete a line, e.g. remove `dev:` and PRs enter at int.
# ----------------------------------------------------------------------------
environments:
  dev: {}
  int: {}
  qa: {}
  stage: {}
  prod: {}

project:
  repository: ""             # blank = the GitHub repo of this clone (what `gh repo view` shows)
  source_path: force-app      # must match a packageDirectories path in sfdx-project.json
  baseline_branch: main       # production branch; every delta starts at merge-base(origin/main, HEAD)

auth:
  # sfdx_url: one secret per org (SF_<NAME>_AUTH_URL) from `sf org display --verbose`.
  #           No Connected App needed. Easiest; works for sandboxes, scratch orgs and production.
  # jwt:      Connected App / External Client App + certificate (SF_<NAME>_USERNAME,
  #           _CONSUMER_KEY, _JWT_KEY). No refresh token to rotate. Set per env with auth_method.
  method: sfdx_url

approvals:
  # A PR counts as approved when it has `required_reviews` approving reviews
  # OR carries this label. The result is the required "sf-approval" check.
  label: approved
  required_reviews: 1
  dismiss_label_on_push: true   # new commits remove the label (re-approve after changes)
  status_check: sf-approval
  auto_merge: true              # approved env-branch PRs squash-merge by themselves once checks pass

quality:
  coverage_threshold: 85        # % every changed Apex class/trigger must reach
  coverage_exempt: []           # classes without executable lines (interfaces/enums are auto-detected)
  dependency_lint: true         # block deleting metadata that other source still references
  # An admin/maintainer can add this label to a PR to waive the coverage and code-analysis
  # gates (never compile or test failures). Who added it is verified at run time.
  bypass_label: bypass-quality-gates

tests:
  require_companion: true       # changed Apex without a test class fails fast (never falls back to RunLocalTests)
  # class_patterns / trigger_patterns / overrides: see docs for the defaults
  overrides: {}
  #  AccountService: [AccountServiceTest, AccountIntegrationTest]

release:
  # source_env defaults to the environment just before production.
  branch_prefix: release/
  tag_prefix: v
  quick_deploy: true            # quick-deploy the validated job (falls back to a full deploy)

promotion:
  enforce_order: true           # each promotion goes to the next env only
  branch_prefix: promote/

deploy:
  wait_minutes: 120
  delta_output_dir: .sgd
  ignore_warnings: false
  # Profiles / permission sets: full = the whole file from source; incremental =
  # only the entries added or changed vs the production baseline (fewer
  # "component does not exist" failures in orgs that lag behind).
  profiles_mode: full

github:
  pat_secret: SF_PIPELINE_PAT   # fine-grained PAT: contents, pull requests, workflows, administration (read/write)
  status_check_app_id: -1       # -1 = any source may post statuses; 15368 = GitHub Actions only
  labels:
    promote_prefix: "promote:"
    deploy_prefix: "deploy:"

tooling:
  node_version: "22"
  sf_cli_version: "2.153.5"
  sgd_version: "6.45.1"

notifications:
  chat:
    # Deploy / release / sync outcomes to Slack, Microsoft Teams, Webex, any JSON
    # webhook, or a token-based chat API. The provider is auto-detected from the
    # webhook URL. Store ONE of: CHAT_WEBHOOK_URL, or CHAT_API_URL + CHAT_API_TOKEN
    # + CHAT_CHANNEL_ID. A chat failure only warns; it never fails a deploy.
    enabled: false
    provider: auto            # auto | slack | teams | webex | generic | api
    deploy_success: true      # also announce successful env deploys (failures always are)
  jira:
    # Comment on + transition every Jira issue key found in the branch name, PR
    # title or release notes to the env's `jira_status` after each deploy.
    # Needs JIRA_BASE_URL, JIRA_EMAIL, JIRA_API_TOKEN secrets; best effort.
    enabled: false

audit:
  # One JSON record per real deploy, appended to this branch (independent of
  # Actions log retention).
  enabled: true
  branch: audit-log

name: "SF Pipeline Changes"
description: >-
  Install the Salesforce CLI + sfdx-git-delta, compute the delta between the
  baseline branch and HEAD, and (optionally) render + upload a component manifest.
  Wraps install-sf.sh, delta.sh and manifest_to_md.py so reusable workflows can
  detect deployable changes without checking out the central actions repo.

inputs:
  node_version:
    required: false
    default: "22"
  baseline_branch:
    required: true
  api_version:
    required: false
    default: "66.0"
  manifest_title:
    description: "If set, render+upload a manifest with this title. Blank = skip."
    required: false
    default: ""
  env_name:
    description: "Used only in the manifest filename / artifact name."
    required: false
    default: "env"
  compare_branch:
    description: >-
      Optional. When set (and different from baseline_branch), ALSO compute an
      INFORMATIONAL delta of HEAD vs this branch (e.g. the target env branch)
      and upload it as `envcompare-<env_name>`. Does NOT affect what deploys —
      the deploy always uses the baseline (Prod) delta.
    required: false
    default: ""
  delta_merge_base:
    description: >-
      When 'true', compute the baseline delta against the merge-base of
      baseline_branch and HEAD (three-dot). Match the deploy for target baselines.
    required: false
    default: "false"

outputs:
  has_changes:
    description: "true when the delta contains deployable/destructive changes"
    value: "${{ steps.delta.outputs.has_changes }}"

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node_version }}

    - name: Install Salesforce CLI + sfdx-git-delta
      shell: bash
      run: bash "$GITHUB_ACTION_PATH/../scripts/install-sf.sh"

    - name: Compute delta vs baseline
      id: delta
      shell: bash
      env:
        DELTA_FROM: origin/${{ inputs.baseline_branch }}
        DELTA_TO: HEAD
        DELTA_OUTPUT: .sgd
        DELTA_MERGE_BASE: ${{ inputs.delta_merge_base }}
        SF_API_VERSION: ${{ inputs.api_version }}
      run: bash "$GITHUB_ACTION_PATH/../scripts/delta.sh"

    - name: Render component manifest
      if: ${{ inputs.manifest_title != '' && steps.delta.outputs.has_changes == 'true' }}
      shell: bash
      run: |
        python3 "$GITHUB_ACTION_PATH/../scripts/manifest_to_md.py" \
          --dir .sgd \
          --title "${{ inputs.manifest_title }} — ${{ inputs.env_name }}" \
          --out "manifest-${{ inputs.env_name }}.md"

    - name: Upload PR change manifest
      if: ${{ inputs.manifest_title != '' && steps.delta.outputs.has_changes == 'true' }}
      uses: actions/upload-artifact@v4
      with:
        name: pr-manifest-${{ inputs.env_name }}
        path: manifest-${{ inputs.env_name }}.md
        if-no-files-found: ignore

    # ---- INFORMATIONAL: how this branch compares to the target env branch ----
    # Purely for visibility (e.g. "feature vs int"). This delta is NOT deployed;
    # the deploy always uses the Prod baseline above.
    - name: Compute comparison delta vs ${{ inputs.compare_branch }}
      id: cmp
      if: ${{ inputs.compare_branch != '' && inputs.compare_branch != inputs.baseline_branch }}
      shell: bash
      env:
        DELTA_FROM: origin/${{ inputs.compare_branch }}
        DELTA_TO: HEAD
        DELTA_OUTPUT: .sgd-cmp
        SF_API_VERSION: ${{ inputs.api_version }}
      run: bash "$GITHUB_ACTION_PATH/../scripts/delta.sh"

    - name: Render comparison manifest
      if: ${{ inputs.compare_branch != '' && inputs.compare_branch != inputs.baseline_branch && steps.cmp.outputs.has_changes == 'true' }}
      shell: bash
      run: |
        python3 "$GITHUB_ACTION_PATH/../scripts/manifest_to_md.py" \
          --dir .sgd-cmp \
          --title "Comparison vs \`${{ inputs.compare_branch }}\` (informational — not deployed)" \
          --out "envcompare-${{ inputs.env_name }}.md"

    - name: Upload comparison manifest
      if: ${{ inputs.compare_branch != '' && inputs.compare_branch != inputs.baseline_branch && steps.cmp.outputs.has_changes == 'true' }}
      uses: actions/upload-artifact@v4
      with:
        name: envcompare-${{ inputs.env_name }}
        path: envcompare-${{ inputs.env_name }}.md
        if-no-files-found: ignore

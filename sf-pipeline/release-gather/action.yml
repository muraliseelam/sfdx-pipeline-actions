name: "SF Pipeline Release Gather"
description: >-
  Resolve the set of stories for a weekly release from the pipeline's own
  deployment state — NO Jira required. Gathers every MERGED pull request that has
  been promoted all the way to the LAST environment in the promotion chain (label
  `deployed:<last env>`) and is targeting the
  production baseline branch. The label is only the index: a story is gathered
  only when its commit carries a `deploy-<env>` = success commit status for EVERY
  stage, written by the pipeline's own token (anyone with triage can add a label,
  and anyone with write can post a status under their own name). Emits the story
  branches AND the exact commit that was deployed, so the release ships what the
  stages run — never commits pushed to the branch afterwards. A PR can opt OUT of
  the release by adding the `hold` label. Merged or
  closed PRs drop out naturally. Fails fast with a readable message when nothing
  qualifies.

inputs:
  label:
    description: >-
      PR label that marks a branch as ready for release. Callers should pass the
      `release_label` output of `plan.py outputs`, which derives it from the last
      configured environment so renaming environments needs no change here.
    required: false
    default: "deployed:stage"
  exclude_label:
    description: "PRs carrying this label are held back from the release."
    required: false
    default: "hold"
  base:
    description: "Only gather PRs whose base branch is this (the production baseline). Empty = any base."
    required: false
    default: ""
  baseline:
    description: >-
      The production baseline branch. A story whose deployed commit is already in it
      shipped in an earlier release and is skipped. Empty = only skip stories whose
      branch was deleted.
    required: false
    default: ""
  stories:
    description: >-
      Optional explicit story branches (space/comma-separated). Restricts the release
      to these branches, whatever their labels; each must still be proven deployed to
      every stage, and a named story that isn't fails the run. Empty = every ready story.
    required: false
    default: ""
  require_statuses:
    description: >-
      Comma-separated commit-status contexts that prove a real deploy, one per stage
      (e.g. `deploy-int,deploy-qa,deploy-stage`). Every one must be `success` on the
      story's commit. Empty = only `deploy-<label without the "deployed:" prefix>`.
    required: false
    default: ""
  status_creator:
    description: >-
      Login whose commit statuses are trusted. The pipeline writes `deploy-<env>` with
      the workflow token, so its statuses are created by `github-actions[bot]`.
    required: false
    default: "github-actions[bot]"
  repo:
    description: "owner/repo to query. Defaults to the current repository."
    required: false
    default: ""
  github_token:
    description: "Token used to query PRs and commit statuses (needs `statuses: read`)."
    required: false
    default: ""

outputs:
  stories:
    description: "Space-separated feature branch names to include in the release."
    value: ${{ steps.gather.outputs.stories }}
  keys:
    description: "Space-separated PR numbers gathered for the release."
    value: ${{ steps.gather.outputs.keys }}
  shas:
    description: >-
      Space-separated deployed commit of each story, aligned with `stories`. Merge
      these, not the branches: a branch can move after its promotions.
    value: ${{ steps.gather.outputs.shas }}
  held:
    description: >-
      Space-separated head branches of every PR carrying `exclude_label`, so the
      caller can check that none of their content reached the release anyway.
    value: ${{ steps.gather.outputs.held }}
  merges:
    description: >-
      Space-separated merge (squash) commits of every PR of the gathered stories,
      i.e. what those stories put on the env branches.
    value: ${{ steps.gather.outputs.merges }}

runs:
  using: composite
  steps:
    - id: gather
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        LABEL: ${{ inputs.label }}
        EXCLUDE_LABEL: ${{ inputs.exclude_label }}
        BASE: ${{ inputs.base }}
        BASELINE: ${{ inputs.baseline }}
        ONLY: ${{ inputs.stories }}
        REQUIRE: ${{ inputs.require_statuses }}
        STATUS_CREATOR: ${{ inputs.status_creator }}
        REPO: ${{ inputs.repo }}
      run: |
        set -euo pipefail
        [ -n "$REPO" ] || REPO="$GITHUB_REPOSITORY"
        [ -n "${GH_TOKEN:-}" ] || GH_TOKEN="${GITHUB_TOKEN:-}"
        export GH_TOKEN
        [ -n "$REQUIRE" ] || REQUIRE="deploy-${LABEL#deployed:}"
        ONLY="$(echo "${ONLY//,/ }" | xargs || true)"

        if [ -n "$ONLY" ]; then
          echo "::group::Gathering the named release stories ($ONLY), excluding '$EXCLUDE_LABEL'"
        else
          echo "::group::Gathering release stories (merged PRs labeled '$LABEL', base='${BASE:-any}', excluding '$EXCLUDE_LABEL')"
        fi
        echo "Proof of deploy: ${REQUIRE//,/, } = success, created by $STATUS_CREATOR"

        BASE_ARGS=()
        [ -n "$BASE" ] && BASE_ARGS=(--base "$BASE")

        # One query for every MERGED PR carrying the release label. Promotion PRs
        # are squash-merged into the target env branch once their deploy succeeds,
        # so the release set is the collection of MERGED PRs carrying $LABEL.
        # The control PR people work on and the env PRs the pipeline opens share
        # one head branch, so a hold on ANY of them holds the story, and each story
        # is listed once, under its lowest PR number. An explicit list looks up the
        # named branches instead: the commit statuses below decide, not the label.
        HELD="$(gh pr list --repo "$REPO" --state all --label "$EXCLUDE_LABEL" \
                  --json headRefName --limit 200 --jq '[.[].headRefName] | unique | join(" ")')"
        if [ -n "$ONLY" ]; then
          ALL="[]"
          for s in $ONLY; do
            ONE="$(gh pr list --repo "$REPO" --state merged --head "$s" "${BASE_ARGS[@]}" \
                     --json number,headRefName,headRefOid,mergeCommit --limit 100)"
            ALL="$(A="$ALL" B="$ONE" python3 -c 'import json,os; print(json.dumps(json.loads(os.environ["A"]) + json.loads(os.environ["B"])))')"
          done
        else
          ALL="$(gh pr list --repo "$REPO" --state merged --label "$LABEL" "${BASE_ARGS[@]}" \
                   --json number,headRefName,headRefOid,mergeCommit --limit 200)"
        fi
        # Every PR of a story is a candidate commit (its head when it merged),
        # newest PR first: the control PR's head is what the pipeline deployed.
        RAW="$(ALL="$ALL" HELD="$HELD" python3 -c '
        import json, os, sys
        held = set(os.environ["HELD"].split())
        groups = {}
        for p in sorted(json.loads(os.environ["ALL"]), key=lambda p: p["number"]):
            if p["headRefName"] in held:
                print("  hold #%s -> %s" % (p["number"], p["headRefName"]), file=sys.stderr)
                continue
            g = groups.setdefault(p["headRefName"], {"number": p["number"], "headRefName": p["headRefName"], "cands": [], "merges": []})
            m = (p.get("mergeCommit") or {}).get("oid")
            g["merges"] += [m] if m else []
            g["cands"] = ["%s:%s" % (p["number"], p["headRefOid"])] + [c for c in g["cands"] if not c.endswith(":" + p["headRefOid"])]
        print(json.dumps(list(groups.values())))
        ')"

        STORIES="$(echo "$RAW" | python3 -c 'import sys,json;print(" ".join(p["headRefName"] for p in json.load(sys.stdin)))')"
        KEYS="$(echo "$RAW"    | python3 -c 'import sys,json;print(" ".join(str(p["number"]) for p in json.load(sys.stdin)))')"

        echo "PRs: ${KEYS:-<none>}"
        echo "$RAW" | python3 -c 'import sys,json; [print("  ok #%s -> %s" % (p["number"], p["headRefName"])) for p in json.load(sys.stdin)]'
        echo "::endgroup::"

        # A named story with no merged PR (or on hold) is a mistake worth stopping for.
        PROBLEMS=""
        for s in $ONLY; do
          case " $STORIES " in
            *" $s "*) ;;
            *) case " $HELD " in
                 *" $s "*) PROBLEMS="$PROBLEMS"$'\n'"  - $s: on '$EXCLUDE_LABEL'" ;;
                 *)        PROBLEMS="$PROBLEMS"$'\n'"  - $s: no merged PR from this branch" ;;
               esac ;;
          esac
        done

        if [ -z "$STORIES" ]; then
          if [ -n "$ONLY" ]; then
            echo "::error::None of the named stories can be released:${PROBLEMS}"
          else
            echo "::error::No merged PRs are labeled '$LABEL'${BASE:+ (base $BASE)}. Promote at least one branch through the full chain (the final promotion PR gets '$LABEL' and merges automatically), or remove a '$EXCLUDE_LABEL' hold, then re-run."
          fi
          exit 1
        fi

        # A gathered PR whose head branch no longer exists on origin was already
        # shipped in a PRIOR release and its feature branch cleaned up — it should
        # drop out of the set, NOT fail the whole release. (Merged PRs keep their
        # their release label forever, so without this every past release keeps
        # re-appearing here and aborts once its branch is deleted.) Skip the missing
        # ones with a notice and rebuild the aligned STORIES/KEYS from the
        # survivors; only fail if nothing live remains.
        #
        # For a live story, release the newest candidate commit that is not in
        # the baseline yet and that the pipeline really deployed to every stage:
        # each `deploy-<env>` status must be `success` and created by
        # $STATUS_CREATOR. A label, or a status somebody posted by hand, is not
        # proof — that is how a story deployed to int only reached a release.
        git fetch origin --prune --quiet || true
        [ -n "$BASELINE" ] && git fetch origin "+refs/heads/$BASELINE:refs/remotes/origin/$BASELINE" --quiet || true
        OUT=""
        while IFS=$'\t' read -r s key cands; do
          if ! git ls-remote --exit-code --heads origin "$s" >/dev/null 2>&1; then
            echo "::notice::Skipping '$s' — its branch no longer exists on origin (already released / cleaned up)."
            [ -n "$ONLY" ] && PROBLEMS="$PROBLEMS"$'\n'"  - $s: the branch no longer exists on origin"
            continue
          fi
          git fetch origin "+refs/heads/$s:refs/remotes/origin/$s" --quiet || true
          PICK=""; PICK_PR=""; SHIPPED=""; UNPROVEN=""
          for c in $cands; do
            n="${c%%:*}"; sha="${c#*:}"
            git cat-file -e "${sha}^{commit}" 2>/dev/null || git fetch --quiet origin "$sha" 2>/dev/null || true
            if ! git cat-file -e "${sha}^{commit}" 2>/dev/null; then
              UNPROVEN="$UNPROVEN"$'\n'"    #$n @ ${sha:0:8}: commit not found on origin"
              continue
            fi
            # Shipped: older candidates are superseded work (e.g. before a rebase).
            if [ -n "$BASELINE" ] && git merge-base --is-ancestor "$sha" "origin/$BASELINE" 2>/dev/null; then
              SHIPPED="#$n @ ${sha:0:8}"
              break
            fi
            # Newest first, so the first line per context is its current status.
            if ! ST="$(gh api "repos/$REPO/commits/$sha/statuses?per_page=100" --paginate \
                         --jq '.[] | [.context, (.creator.login // ""), .state] | @tsv')"; then
              echo "::error::Could not read the commit statuses of ${sha:0:8} (the job needs 'statuses: read')."
              exit 1
            fi
            MISS=""
            for ctx in ${REQUIRE//,/ }; do
              mine="$(awk -F'\t' -v c="$ctx" -v u="$STATUS_CREATOR" '$1==c && $2==u {print $3; exit}' <<< "$ST")"
              [ "$mine" = "success" ] && continue
              other="$(awk -F'\t' -v c="$ctx" -v u="$STATUS_CREATOR" '$1==c && $2!=u {print $2; exit}' <<< "$ST")"
              MISS="${MISS:+$MISS, }$ctx=${mine:-missing}${other:+ (the one set by @$other is not trusted)}"
            done
            if [ -z "$MISS" ]; then PICK="$sha"; PICK_PR="$n"; break; fi
            UNPROVEN="$UNPROVEN"$'\n'"    #$n @ ${sha:0:8}: $MISS"
          done

          if [ -n "$UNPROVEN" ] && [ -z "$ONLY" ]; then
            echo "::warning::'$s' carries '$LABEL' on a commit the pipeline never deployed to every stage — a label is not proof, that commit is NOT released:${UNPROVEN}"
          elif [ -n "$UNPROVEN" ] && [ -n "$PICK" ]; then
            echo "::notice::'$s': newer commits not deployed to every stage are left out:${UNPROVEN}"
          fi
          if [ -z "$PICK" ]; then
            if [ -n "$UNPROVEN" ]; then
              [ -n "$ONLY" ] && PROBLEMS="$PROBLEMS"$'\n'"  - $s: not deployed to every stage by the pipeline:${UNPROVEN}"
            elif [ -n "$SHIPPED" ]; then
              echo "::notice::Skipping '$s' — its deployed commit ($SHIPPED) is already in '$BASELINE' (shipped in an earlier release)."
            fi
            continue
          fi

          # Release the deployed commit, never the branch tip.
          TIP="$(git rev-parse -q --verify "origin/$s" || true)"
          if [ -n "$TIP" ] && [ "$TIP" != "$PICK" ]; then
            if git merge-base --is-ancestor "$PICK" "$TIP"; then
              echo "::warning::'$s' has $(git rev-list --count "$PICK..$TIP") commit(s) after ${PICK:0:8}, the commit the pipeline deployed. They never went through the stages and are NOT in this release."
            else
              echo "::warning::'$s' was rewritten after ${PICK:0:8} was deployed — releasing ${PICK:0:8}, not the branch tip ${TIP:0:8}."
            fi
          fi
          echo "  ✓ $s @ ${PICK:0:8} (#$PICK_PR)"
          OUT="$OUT$s $key $PICK"$'\n'
        done < <(echo "$RAW" | python3 -c 'import sys,json; [print("%s\t%s\t%s" % (p["headRefName"], p["number"], " ".join(p["cands"]))) for p in json.load(sys.stdin)]')

        if [ -n "$PROBLEMS" ]; then
          echo "::error::Some named stories can't be released — each must be proven deployed to every stage (${REQUIRE//,/, }):${PROBLEMS}"
          exit 1
        fi
        STORIES="$(awk 'NF {print $1}' <<< "$OUT" | xargs || true)"
        KEYS="$(awk 'NF {print $2}' <<< "$OUT" | xargs || true)"
        SHAS="$(awk 'NF {print $3}' <<< "$OUT" | xargs || true)"
        if [ -z "$STORIES" ]; then
          echo "::error::No live release branches remain after skipping already-shipped ones and ones not proven deployed to every stage (${REQUIRE//,/, }). Promote at least one branch to the last stage (its PR gets '$LABEL' and merges automatically), then re-run."
          exit 1
        fi

        # The squash commits the gathered stories' PRs made on the env branches: a
        # story that merged one of them carries a story that ships anyway.
        MERGES="$(RAW="$RAW" STORIES="$STORIES" python3 -c 'import json,os; s=set(os.environ["STORIES"].split()); print(" ".join(m for g in json.loads(os.environ["RAW"]) if g["headRefName"] in s for m in g["merges"]))')"
        { echo "stories=$STORIES"; echo "keys=$KEYS"; echo "shas=$SHAS"; echo "held=$HELD"; echo "merges=$MERGES"; } >> "$GITHUB_OUTPUT"
        echo "Resolved release stories: $STORIES"

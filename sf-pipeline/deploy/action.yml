name: "SF Deploy (one org)"
description: >-
  Authenticate to one Salesforce org via JWT, compute the delta vs the baseline
  branch, publish the component manifest, and validate / deploy / quick-deploy it.
  Config-driven and org-agnostic — the caller passes the environment + secrets.

inputs:
  environment:
    description: "Org alias / logical environment name (e.g. int, qa, prod)"
    required: true
  ref:
    description: "Git ref (branch/sha) already checked out by the caller"
    required: true
  check_only:
    description: "true = validate only (no real deploy)"
    required: false
    default: "false"
  quick_deploy_id:
    description: "A previously validated deploy id to quick-deploy"
    required: false
    default: ""
  test_level:
    description: "NoTestRun|RunSpecifiedTests|RunLocalTests|RunAllTestsInOrg"
    required: false
    default: "RunSpecifiedTests"
  manifest_title:
    description: "Heading used for the component manifest summary"
    required: false
    default: "Deployment"
  baseline_branch:
    description: "Branch the delta is computed against (production baseline)"
    required: true
  delta_merge_base:
    description: >-
      When 'true', compute the delta against the MERGE-BASE of baseline_branch and
      HEAD (three-dot) instead of the baseline tip. Required for diff-vs-target
      baselines so a drifted target env doesn't produce spurious deletions.
    required: false
    default: "false"
  source_path:
    description: "Root of the Salesforce metadata (sfdx format)"
    required: false
    default: "force-app"
  api_version:
    description: "Metadata API version for the delta package"
    required: false
    default: "66.0"
  node_version:
    description: "Node version for the Salesforce CLI"
    required: false
    default: "22"
  coverage_gate:
    description: >-
      true = enforce the Apex coverage threshold when Apex changed. A real deploy
      is then validated with its tests first and quick-deployed only if the gate
      passes, so a failing gate deploys nothing.
    required: false
    default: "false"
  coverage_threshold:
    description: "Minimum aggregate Apex code coverage percent"
    required: false
    default: "75"
  profiles_mode:
    description: "full | incremental — how Profiles/Permission Sets are deployed (REQ-006)"
    required: false
    default: "full"
  bypass:
    description: "true = admin bypass; skip tests + coverage enforcement"
    required: false
    default: "false"
  destructive_test_names:
    description: >-
      Comma-separated canary test class(es) to run for a PRODUCTION destructive /
      no-Apex deploy. Production forbids NoTestRun for Apex deletions; specifying a
      stable passing test satisfies the platform without running the whole (possibly
      red) org suite. Blank = fall back to RunLocalTests.
    required: false
    default: ""
  sf_consumer_key:
    description: "Connected app consumer key"
    required: true
  sf_username:
    description: "Integration username"
    required: true
  sf_instance_url:
    description: "Login / My Domain URL"
    required: false
    default: ""
  sf_jwt_key:
    description: "base64-encoded server.key"
    required: true

outputs:
  deploy_id:
    description: >-
      check_only=true: the validation id to pass as quick_deploy_id later — blank
      when the validation ran no Apex tests, which Salesforce cannot quick-deploy.
      check_only=false: the id of the deploy job that changed the org (for a quick
      deploy, the quick deploy's own id, not the validation's). Blank when nothing
      was deployed.
    value: ${{ steps.quick.outputs.deploy_id || steps.run.outputs.deploy_id }}
  validation_id:
    description: >-
      The check-only validation behind this run, quick-deployable or not (for a
      quick deploy, the validated job it promoted). Blank for a plain deploy.
    value: ${{ steps.run.outputs.validation_id }}
  has_changes:
    description: "Whether the delta contained deployable changes"
    value: ${{ steps.delta.outputs.has_changes }}
  outcome:
    description: "success | failure | no_changes"
    value: ${{ steps.report.outputs.status }}

runs:
  using: composite
  steps:
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node_version }}

    - name: Install Salesforce CLI + sfdx-git-delta
      shell: bash
      run: bash "$GITHUB_ACTION_PATH/../scripts/install-sf.sh"

    - name: Authenticate to ${{ inputs.environment }}
      shell: bash
      env:
        SF_CONSUMER_KEY: ${{ inputs.sf_consumer_key }}
        SF_USERNAME: ${{ inputs.sf_username }}
        SF_INSTANCE_URL: ${{ inputs.sf_instance_url }}
        SF_JWT_KEY: ${{ inputs.sf_jwt_key }}
      run: bash "$GITHUB_ACTION_PATH/../scripts/auth-jwt.sh" "${{ inputs.environment }}"

    - name: Compute delta vs ${{ inputs.baseline_branch }}
      id: delta
      shell: bash
      env:
        DELTA_FROM: origin/${{ inputs.baseline_branch }}
        DELTA_TO: HEAD
        DELTA_OUTPUT: .sgd
        DELTA_MERGE_BASE: ${{ inputs.delta_merge_base }}
        SF_API_VERSION: ${{ inputs.api_version }}
      run: bash "$GITHUB_ACTION_PATH/../scripts/delta.sh"

    # Diffs against the ref the delta really came from (the merge-base in
    # three-dot mode), not the baseline's tip, so a baseline that moved on is not
    # mistaken for this branch's change.
    - name: Dependency lint (destructive safety)
      if: steps.delta.outputs.has_changes == 'true'
      shell: bash
      run: |
        python3 "$GITHUB_ACTION_PATH/../scripts/dependency_lint.py" \
          --dir .sgd \
          --source-root "${{ inputs.source_path }}" \
          --baseline "${{ steps.delta.outputs.from_ref || format('origin/{0}', inputs.baseline_branch) }}"

    # Salesforce fails the whole deploy on a deletion of something the org no
    # longer has. Drop those (listed in the report), after the lint has checked
    # the branch's own deletions and before anything reads the manifest. A quick
    # deploy promotes an already validated package, so nothing local is deployed.
    - name: Skip deletions the org no longer has
      id: prune
      if: ${{ steps.delta.outputs.has_changes == 'true' && inputs.quick_deploy_id == '' }}
      shell: bash
      run: |
        python3 "$GITHUB_ACTION_PATH/../scripts/prune_destructive.py" \
          --dir .sgd \
          --target-org "${{ inputs.environment }}" \
          --api-version "${{ inputs.api_version }}"

    - name: Detect Apex in the delta
      id: scope
      if: steps.delta.outputs.has_changes == 'true'
      shell: bash
      run: |
        set -uo pipefail
        PKG=".sgd/package/package.xml"
        DSTR=".sgd/destructiveChanges/destructiveChanges.xml"
        HAS_APEX="false"
        APEX_DESTRUCTIVE="false"
        if [ -f "$PKG" ] && grep -Eq "<name>(ApexClass|ApexTrigger)</name>" "$PKG"; then
          HAS_APEX="true"
        fi
        # Apex can also be DELETED (destructive-only). The additive package is then
        # empty, but Apex is still involved — production forbids NoTestRun for that.
        if [ -f "$DSTR" ] && grep -Eq "<name>(ApexClass|ApexTrigger)</name>" "$DSTR"; then
          APEX_DESTRUCTIVE="true"
        fi
        echo "Delta contains Apex (additive): $HAS_APEX; Apex deletions: $APEX_DESTRUCTIVE"
        echo "has_apex=$HAS_APEX" >> "$GITHUB_OUTPUT"
        echo "apex_destructive=$APEX_DESTRUCTIVE" >> "$GITHUB_OUTPUT"

    - name: Render component manifest
      if: steps.delta.outputs.has_changes == 'true'
      shell: bash
      env:
        # Passed through env: a title can carry a branch name with shell characters.
        MANIFEST_TITLE: ${{ inputs.manifest_title }} — ${{ inputs.environment }}
      run: |
        python3 "$GITHUB_ACTION_PATH/../scripts/manifest_to_md.py" \
          --dir .sgd \
          --title "$MANIFEST_TITLE" \
          --out manifest-${{ inputs.environment }}.md

    - name: Upload manifest artifact
      if: steps.delta.outputs.has_changes == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: manifest-${{ inputs.environment }}
        path: |
          manifest-${{ inputs.environment }}.md
          .sgd/package/package.xml
          .sgd/destructiveChanges/destructiveChanges.xml
        if-no-files-found: ignore

    - name: Resolve specified tests
      id: tests
      if: steps.delta.outputs.has_changes == 'true'
      shell: bash
      run: python3 "$GITHUB_ACTION_PATH/../scripts/specified_tests.py" --dir .sgd --source-root "${{ inputs.source_path }}"

    # Incremental mode self-diffs each profile against the ref the delta came from.
    # Against the baseline's TIP, an entry another change updated there (the
    # target env branch, or main after a hotfix) would look "changed" here and
    # be deployed back to this branch's older value.
    - name: Apply Profile / Permission Set mode (REQ-006)
      if: steps.delta.outputs.has_changes == 'true'
      shell: bash
      run: |
        python3 "$GITHUB_ACTION_PATH/../scripts/profiles.py" \
          --package .sgd/package/package.xml \
          --source-root "${{ inputs.source_path }}" \
          --mode "${{ inputs.profiles_mode }}" \
          --baseline "${{ steps.delta.outputs.from_ref || format('origin/{0}', inputs.baseline_branch) }}"

    - name: Deploy / validate / quick-deploy
      id: run
      # A quick deploy promotes the validated job whatever the local delta says.
      if: ${{ steps.delta.outputs.has_changes == 'true' || inputs.quick_deploy_id != '' }}
      shell: bash
      env:
        COVERAGE_GATE: ${{ inputs.coverage_gate }}
      run: |
        set -euo pipefail
        ALIAS="${{ inputs.environment }}"
        CHECK="${{ inputs.check_only }}"
        QUICK_ID="${{ inputs.quick_deploy_id }}"
        REQUESTED_LEVEL="${{ inputs.test_level }}"
        RESOLVED_LEVEL="${{ steps.tests.outputs.test_level }}"
        TESTS="${{ steps.tests.outputs.tests }}"
        HAS_APEX="${{ steps.scope.outputs.has_apex }}"
        APEX_DESTRUCTIVE="${{ steps.scope.outputs.apex_destructive }}"
        BYPASS="${{ inputs.bypass }}"
        CANARY_TESTS="${{ inputs.destructive_test_names }}"
        PKG=".sgd/package/package.xml"
        DSTR=".sgd/destructiveChanges/destructiveChanges.xml"
        IS_PROD="false"
        case "$ALIAS" in prod|prod-validate|prod-*) IS_PROD="true" ;; esac

        # The job id in an sf --json result: result.id, or data.id in the error envelope.
        job_id() { python3 -c 'import json,sys; d=json.load(open(sys.argv[1], encoding="utf-8")); r=d.get("result") or d.get("data") or {}; print(r.get("id", "") if isinstance(r, dict) else "")' "$1" 2>/dev/null || true; }
        # When sf printed no JSON (e.g. it crashed), give the report the message instead.
        result_or() { python3 -c 'import json,sys; json.load(open(sys.argv[1], encoding="utf-8"))' deploy-result.json 2>/dev/null || DEPLOY_MSG="$1" python3 -c 'import json,os; json.dump({"status":1,"result":{},"message":os.environ["DEPLOY_MSG"]}, open("deploy-result.json","w"))'; }

        # Quick-deploy path: promote a previously validated deployment. The
        # "Quick-deploy the validated job" step below does it.
        if [ -n "$QUICK_ID" ]; then
          echo "Quick deploy requested: validated job $QUICK_ID → $ALIAS"
          { echo "mode=quick"; echo "validation_id=$QUICK_ID"; echo "quick_job=$QUICK_ID"; } >> "$GITHUB_OUTPUT"
          exit 0
        fi

        # Every change in the delta was a deletion the org no longer has (dropped
        # by "Skip deletions the org no longer has"): the org already matches.
        if ! grep -q "<types>" "$PKG" && ! { [ -f "$DSTR" ] && grep -q "<types>" "$DSTR"; }; then
          echo "Nothing left to deploy to $ALIAS: the delta only deletes components the org no longer has."
          echo '{"status":0,"result":{"id":"","success":true,"skipped":"nothing-left"}}' > deploy-result.json
          { echo "mode=nothing-left"; echo "deploy_id="; } >> "$GITHUB_OUTPUT"
          exit 0
        fi

        # Admin bypass: skip Apex tests entirely (also skips the coverage gate).
        if [ "$BYPASS" = "true" ]; then
          echo "::warning::Admin bypass — deploying to $ALIAS with NoTestRun (coverage gate skipped)."
          LEVEL="NoTestRun"
          TESTS=""
        else
          # Choose the effective test level.
          LEVEL="$REQUESTED_LEVEL"
          if [ "$LEVEL" = "RunSpecifiedTests" ]; then
            if [ -n "$TESTS" ]; then
              LEVEL="RunSpecifiedTests"
            elif [ "$HAS_APEX" != "true" ]; then
              # No ADDITIVE Apex. Two sub-cases decide whether tests are required:
              #   * config-only (no Apex added AND none deleted) — a pure metadata
              #     change needs no Apex tests ANYWHERE, production included.
              #   * Apex DELETION (destructive) — production forbids NoTestRun when
              #     Apex is involved, so prod must run test(s); sandboxes may skip.
              case "$ALIAS" in
                prod|prod-validate|prod-*)
                  if [ "$APEX_DESTRUCTIVE" = "true" ]; then
                    if [ -n "$CANARY_TESTS" ]; then
                      echo "Apex deletion targeting production ($ALIAS) — RunSpecifiedTests with canary: $CANARY_TESTS"
                      LEVEL="RunSpecifiedTests"
                      TESTS="$CANARY_TESTS"
                    else
                      echo "Apex deletion targeting production ($ALIAS) — using RunLocalTests."
                      LEVEL="RunLocalTests"
                    fi
                  elif [ "$CHECK" = "true" ] && [ -n "$CANARY_TESTS" ]; then
                    # Salesforce quick-deploys only a validation that ran tests.
                    # With a canary, the approved release quick-deploys exactly
                    # what was validated; without one it is deployed again.
                    echo "Config-only change, production validation ($ALIAS) — RunSpecifiedTests with canary so it can be quick-deployed: $CANARY_TESTS"
                    LEVEL="RunSpecifiedTests"
                    TESTS="$CANARY_TESTS"
                  else
                    echo "Config-only change (no Apex added or deleted), production ($ALIAS) — no Apex tests."
                    LEVEL="NoTestRun"
                  fi ;;
                *)
                  echo "No Apex in the delta — using NoTestRun."
                  LEVEL="NoTestRun" ;;
              esac
            else
              # RunSpecifiedTests was requested and the delta DOES contain Apex,
              # but no test class could be resolved for the changed Apex. Do NOT
              # silently fall back to RunLocalTests — the whole-org suite is slow
              # and fails on unrelated pre-existing red tests, masking the real
              # problem. Fail fast with actionable guidance so the developer adds
              # or renames a matching test class.
              UNTESTED="${{ steps.tests.outputs.untested }}"
              [ -n "$UNTESTED" ] || UNTESTED="the changed Apex class(es)"
              MSG="No Apex test could be resolved for: ${UNTESTED}. RunSpecifiedTests requires each changed Apex class to have a matching test class named <Class>Test (also accepted: Test<Class>, <Class>_Test, <Class>Tests). Add or rename the test class so its name ends in 'Test', then push again. The pipeline will not fall back to running the whole org test suite."
              echo "::error::${MSG}"
              # Write a synthetic failure result so the PR report renders this
              # message in its 'Validation failed' section (deploy_report.py reads
              # the top-level 'message' when there are no structured SF failures).
              DEPLOY_MSG="$MSG" python3 -c 'import json,os; json.dump({"status":1,"result":{},"message":os.environ["DEPLOY_MSG"]}, open("deploy-result.json","w"))'
              exit 1
            fi
          fi
        fi

        # How this run talks to the org:
        #   validate  check-only WITH Apex tests (`sf project deploy validate`): a
        #             validation id Salesforce can quick-deploy later.
        #   dry-run   check-only with NoTestRun. `deploy validate` rejects NoTestRun
        #             (and without a level runs the whole org suite), so this is
        #             `deploy start --dry-run`: every component is still checked
        #             against the org, but Salesforce can't quick-deploy a
        #             validation that ran no tests, so no deploy_id is returned.
        #   gated     a REAL deploy whose coverage gate must pass: validate with the
        #             tests, let "Apex coverage gate" judge that result, then
        #             "Quick-deploy the validated job" — a failing gate never
        #             leaves the change in the org.
        #   deploy    a real deploy (`deploy start`).
        if [ "$CHECK" = "true" ]; then
          if [ "$LEVEL" = "NoTestRun" ]; then MODE="dry-run"; else MODE="validate"; fi
        elif [ "$COVERAGE_GATE" = "true" ] && [ "$BYPASS" != "true" ] && [ "$HAS_APEX" = "true" ] && [ "$LEVEL" != "NoTestRun" ]; then
          MODE="gated"
        else
          MODE="deploy"
        fi
        { echo "mode=$MODE"; echo "level=$LEVEL"; } >> "$GITHUB_OUTPUT"

        ARGS=(--manifest "$PKG"
              --target-org "$ALIAS"
              --wait 180
              --verbose
              --json)
        case "$MODE" in
          validate) CMD=(project deploy validate)
                    echo "Validation-only deploy to $ALIAS (test level $LEVEL)" ;;
          dry-run)  CMD=(project deploy start --dry-run --ignore-conflicts)
                    echo "Check-only deploy to $ALIAS (no Apex tests to run)" ;;
          gated)    CMD=(project deploy validate)
                    echo "Validating for $ALIAS first (test level $LEVEL) — the coverage gate decides before anything is deployed" ;;
          *)        CMD=(project deploy start --ignore-conflicts)
                    echo "Deploying to $ALIAS (test level $LEVEL)" ;;
        esac

        # NoTestRun is accepted only by development orgs (sandbox, scratch,
        # Developer Edition). Production runs no tests for a package without Apex
        # by default, so leave the flag out there instead of having it refused.
        if [ "$LEVEL" = "NoTestRun" ] && [ "$IS_PROD" = "true" ] && [ "$HAS_APEX" != "true" ] && [ "$APEX_DESTRUCTIVE" != "true" ]; then
          echo "Production, no Apex in the delta: no --test-level (Salesforce runs no tests for it)."
        else
          ARGS+=(--test-level "$LEVEL")
        fi

        if [ -f "$DSTR" ] && grep -q "<types>" "$DSTR"; then
          ARGS+=(--post-destructive-changes "$DSTR")
        fi

        if [ "$LEVEL" = "RunSpecifiedTests" ] && [ -n "$TESTS" ]; then
          IFS=',' read -ra T <<< "$TESTS"
          for t in "${T[@]}"; do ARGS+=(--tests "$t"); done
        fi

        set +e
        sf "${CMD[@]}" "${ARGS[@]}" > deploy-result.json
        STATUS=$?
        set -e
        ID="$(job_id deploy-result.json)"
        case "$MODE" in
          validate) { echo "deploy_id=$ID"; echo "validation_id=$ID"; } >> "$GITHUB_OUTPUT" ;;
          dry-run)  { echo "deploy_id="; echo "validation_id=$ID"; } >> "$GITHUB_OUTPUT" ;;
          gated)    echo "validation_id=$ID" >> "$GITHUB_OUTPUT" ;;
          *)        echo "deploy_id=$ID" >> "$GITHUB_OUTPUT" ;;
        esac
        if [ $STATUS -ne 0 ]; then
          if [ $STATUS -eq 69 ]; then
            # The CLI's exit code for a job still running when --wait ran out.
            MSG="The deploy job ${ID:-?} to $ALIAS was still running in Salesforce when the wait ran out and may yet complete. Check Setup → Deployment Status before running it again."
          elif [ "$MODE" = "deploy" ]; then
            MSG="Deployment to $ALIAS failed — see the PR comment / job summary for the specific errors."
          else
            MSG="Validation against $ALIAS failed (check-only, nothing was deployed) — see the PR comment / job summary for the specific errors."
          fi
          echo "::error::$MSG"
          result_or "$MSG"
          exit $STATUS
        fi
        if [ "$MODE" = "gated" ]; then
          if [ -z "$ID" ]; then
            MSG="The validation against $ALIAS passed but returned no job id, so it can't be quick-deployed. Nothing was deployed."
            echo "::error::$MSG"
            exit 1
          fi
          echo "quick_job=$ID" >> "$GITHUB_OUTPUT"
          echo "Validated $ID; it is deployed only if the coverage gate passes."
        elif [ "$MODE" = "validate" ] && [ -z "$ID" ]; then
          echo "::warning::The validation against $ALIAS passed but returned no job id; a later quick deploy is not possible."
        fi

    # Judges the validation in `gated` mode (before anything is deployed) and the
    # check-only result in PR validation. When Salesforce already rejected the
    # deploy, it only records the coverage it measured, so the report shows it.
    - name: Apex coverage gate
      id: coverage
      if: ${{ always() && inputs.coverage_gate == 'true' && inputs.bypass != 'true' && inputs.quick_deploy_id == '' && steps.scope.outputs.has_apex == 'true' && (steps.run.outcome == 'success' || steps.run.outcome == 'failure') }}
      shell: bash
      env:
        COVERAGE_THRESHOLD: ${{ inputs.coverage_threshold }}
        ENVIRONMENT: ${{ inputs.environment }}
        COVERAGE_MEASURE_ONLY: ${{ steps.run.outcome == 'failure' && 'true' || 'false' }}
      run: python3 "$GITHUB_ACTION_PATH/../coverage/coverage-gate.py"

    # Promotes a validated job: the release's approved validation
    # (quick_deploy_id), or a `gated` deploy whose coverage gate just passed.
    - name: Quick-deploy the validated job
      id: quick
      if: ${{ steps.run.outputs.quick_job != '' && (inputs.quick_deploy_id != '' || steps.coverage.outcome == 'success') }}
      shell: bash
      env:
        ALIAS: ${{ inputs.environment }}
        JOB: ${{ steps.run.outputs.quick_job }}
      run: |
        set -euo pipefail
        echo "Quick-deploying validated job $JOB to $ALIAS"
        set +e
        sf project deploy quick --job-id "$JOB" --target-org "$ALIAS" --wait 120 --verbose --json > deploy-result.json
        STATUS=$?
        set -e
        ID="$(python3 -c 'import json,sys; d=json.load(open(sys.argv[1], encoding="utf-8")); r=d.get("result") or d.get("data") or {}; print(r.get("id", "") if isinstance(r, dict) else "")' deploy-result.json 2>/dev/null || true)"
        # The quick deploy's own job id — not the validation's.
        echo "deploy_id=$ID" >> "$GITHUB_OUTPUT"
        if [ $STATUS -ne 0 ]; then
          if [ $STATUS -eq 69 ]; then
            MSG="The quick deploy ${ID:-?} of validated job $JOB to $ALIAS was still running in Salesforce when the wait ran out and may yet complete. Check Setup → Deployment Status before running it again."
          else
            MSG="Salesforce refused the quick deploy of validated job $JOB to $ALIAS, so nothing was deployed. A validation can be quick-deployed once, within 10 days, if it ran Apex tests and the org has not changed under it since. Run the deploy again to validate afresh."
          fi
          echo "::error::$MSG"
          python3 -c 'import json,sys; json.load(open(sys.argv[1], encoding="utf-8"))' deploy-result.json 2>/dev/null \
            || DEPLOY_MSG="$MSG" python3 -c 'import json,os; json.dump({"status":1,"result":{},"message":os.environ["DEPLOY_MSG"]}, open("deploy-result.json","w"))'
          exit $STATUS
        fi
        [ -n "$ID" ] || echo "::warning::The quick deploy to $ALIAS succeeded but returned no job id."
        echo "Quick deploy ${ID:-?} of validated job $JOB to $ALIAS succeeded."

    # ---- Turn the SF result into a readable report + upload it ---------------
    - name: Build deployment report
      id: report
      if: ${{ always() && steps.delta.conclusion == 'success' }}
      shell: bash
      env:
        QUICK_ID: ${{ inputs.quick_deploy_id }}
        HAS_CHANGES: ${{ steps.delta.outputs.has_changes }}
        RUN_OUTCOME: ${{ steps.run.outcome }}
        COVERAGE_OUTCOME: ${{ steps.coverage.outcome }}
        QUICK_JOB: ${{ steps.run.outputs.quick_job }}
        QUICK_OUTCOME: ${{ steps.quick.outcome }}
      run: |
        set -uo pipefail
        # A validated job handed to "Quick-deploy the validated job" (quick or
        # gated mode) succeeded only if that quick deploy did.
        if [ -z "$QUICK_ID" ] && [ "$HAS_CHANGES" != "true" ]; then
          STATUS_STR="no_changes"
        elif [ "$RUN_OUTCOME" = "success" ] && [ "$COVERAGE_OUTCOME" != "failure" ] \
             && { [ -z "$QUICK_JOB" ] || [ "$QUICK_OUTCOME" = "success" ]; }; then
          STATUS_STR="success"
        else
          STATUS_STR="failure"
        fi
        echo "status=$STATUS_STR" >> "$GITHUB_OUTPUT"
        python3 "$GITHUB_ACTION_PATH/../scripts/deploy_report.py" \
          --result deploy-result.json \
          --status "$STATUS_STR" \
          --environment "${{ inputs.environment }}" \
          --check-only "${{ inputs.check_only }}" \
          --mode "${{ steps.run.outputs.mode }}" \
          --has-apex "${{ steps.scope.outputs.has_apex }}" \
          --test-level "${{ steps.run.outputs.level }}" \
          --out-md .deploy/errors.md \
          --out-json .deploy/report.json

    - name: Record audit trail (REQ-018)
      id: audit
      if: ${{ always() && steps.report.conclusion == 'success' }}
      shell: bash
      env:
        AUDIT_TYPE: ${{ inputs.check_only == 'true' && 'Validate' || 'Deploy' }}
        AUDIT_ENVIRONMENT: ${{ inputs.environment }}
        AUDIT_STATUS: ${{ steps.report.outputs.status }}
        AUDIT_CHECK_ONLY: ${{ inputs.check_only }}
        AUDIT_ACTOR: ${{ github.actor }}
        AUDIT_REF: ${{ inputs.ref }}
        AUDIT_SHA: ${{ github.sha }}
        AUDIT_PR: ${{ github.event.pull_request.number }}
        AUDIT_DEPLOY_ID: ${{ steps.quick.outputs.deploy_id || steps.run.outputs.deploy_id }}
        AUDIT_VALIDATION_ID: ${{ steps.run.outputs.validation_id }}
        AUDIT_RUN_ID: ${{ github.run_id }}
        AUDIT_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        AUDIT_REPO: ${{ github.repository }}
        AUDIT_PROFILES_MODE: ${{ inputs.profiles_mode }}
      run: python3 "$GITHUB_ACTION_PATH/../scripts/audit.py"

    - name: Upload deployment report
      if: ${{ always() && steps.report.conclusion == 'success' }}
      uses: actions/upload-artifact@v4
      with:
        name: deploy-report-${{ inputs.environment }}
        path: |
          .deploy/errors.md
          .deploy/report.json
          .deploy/coverage.json
          .deploy/audit-record.json
          .deploy/skipped-deletions.json
        if-no-files-found: ignore

    # Durable, queryable audit trail: append the record to the audit-log branch.
    # Only for REAL deploys/promotions (not the many check-only validations) to
    # keep the branch clean. Best-effort — never fails the deploy.
    - name: Append to audit-log branch (REQ-018)
      if: ${{ always() && steps.audit.conclusion == 'success' && inputs.check_only != 'true' && (steps.delta.outputs.has_changes == 'true' || inputs.quick_deploy_id != '') }}
      continue-on-error: true
      shell: bash
      env:
        AUDIT_TYPE: Deploy
        AUDIT_ENVIRONMENT: ${{ inputs.environment }}
        AUDIT_STATUS: ${{ steps.report.outputs.status }}
        AUDIT_SHA: ${{ github.sha }}
      run: bash "$GITHUB_ACTION_PATH/../scripts/audit-append.sh"

    - name: No changes to deploy
      if: ${{ steps.delta.outputs.has_changes != 'true' && inputs.quick_deploy_id == '' }}
      shell: bash
      env:
        BASELINE: ${{ inputs.baseline_branch }}
        REF: ${{ inputs.ref }}
      run: echo "No deployable delta between origin/$BASELINE and $REF — nothing to do."

name: "SF Pipeline Project Init"
description: >-
  Provision a consumer repository from its own sf-pipeline/pipeline.config.yml:
  environment branches, pipeline labels, and GitHub Environments. Idempotent and
  additive — it never deletes or moves anything. Dry run by default.

inputs:
  apply:
    description: "Set to 'true' to actually create things. Anything else is a dry run."
    required: false
    default: "false"
  config:
    description: "Path (in the caller repo) to pipeline.config.yml"
    required: false
    default: "sf-pipeline/pipeline.config.yml"
  repo:
    description: "owner/repo to provision. Defaults to the current repository."
    required: false
    default: ""
  github_token:
    description: >-
      Token used to create branches, labels and environments. The default
      GITHUB_TOKEN can do branches and labels; creating GitHub Environments
      needs a token with repo ADMIN (a PAT).
    required: false
    default: ""

runs:
  using: composite
  steps:
    - id: run
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token || github.token }}
        APPLY: ${{ inputs.apply }}
        CFG: ${{ inputs.config }}
        TARGET_REPO: ${{ inputs.repo || github.repository }}
      run: |
        set -euo pipefail
        ARGS=( --repo "$TARGET_REPO" --config "$CFG" )
        # Lowercase without bash 4 ${x,,} so this also runs on macOS bash 3.2.
        if [ "$(printf '%s' "$APPLY" | tr '[:upper:]' '[:lower:]')" = "true" ]; then
          ARGS+=( --apply )
        fi
        bash "$GITHUB_ACTION_PATH/../scripts/init-project.sh" "${ARGS[@]}"

name: "SF Pipeline Jira Update"
description: >-
  Best-effort Jira Cloud update from a deploy. Adds a "Deployed to <env>"
  comment and transitions the linked story to the configured status. A silent
  no-op when Jira credentials are not supplied, so pipelines work before Jira is
  wired up. The issue key is taken from `story_key`, or derived from `ref`
  (e.g. feature/PROJ-123-foo -> PROJ-123). Wraps scripts/jira.py so reusable
  workflows can update Jira without checking out the central actions repo.

inputs:
  environment:
    description: "Environment name shown in the Jira comment (dev, int, qa, …)"
    required: true
  status:
    description: "Target Jira status to transition the story to (config-driven; blank = comment only)"
    required: false
    default: ""
  story_key:
    description: "Explicit Jira issue key (e.g. PROJ-123). If blank, derived from `ref`."
    required: false
    default: ""
  ref:
    description: "A branch/PR name to derive the key from when story_key is blank"
    required: false
    default: ""
  run_url:
    description: "Link to the deploy run, added to the comment"
    required: false
    default: ""
  jira_base_url:
    required: false
    default: ""
  jira_email:
    required: false
    default: ""
  jira_api_token:
    required: false
    default: ""

runs:
  using: composite
  steps:
    - shell: bash
      env:
        JIRA_BASE_URL: ${{ inputs.jira_base_url }}
        JIRA_EMAIL: ${{ inputs.jira_email }}
        JIRA_API_TOKEN: ${{ inputs.jira_api_token }}
        # Through env, never interpolated into the script: ref is a branch name
        # and a branch name can contain shell syntax.
        STORY_KEY: ${{ inputs.story_key }}
        REF: ${{ inputs.ref }}
        ENVIRONMENT: ${{ inputs.environment }}
        STATUS: ${{ inputs.status }}
        RUN_URL: ${{ inputs.run_url }}
      run: |
        set -euo pipefail
        SCRIPT="$GITHUB_ACTION_PATH/../scripts/jira.py"
        KEY="$STORY_KEY"
        if [ -z "$KEY" ]; then
          KEY="$(python3 "$SCRIPT" extract-key "$REF")"
        fi
        if [ -z "$KEY" ]; then
          echo "[jira] no issue key from story_key or ref '$REF' — skipping."
          exit 0
        fi
        python3 "$SCRIPT" deploy "$KEY" "$ENVIRONMENT" "$STATUS" "$RUN_URL"

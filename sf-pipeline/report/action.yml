name: "SF PR Report"
description: >-
  Download the change-manifest and deployment artifacts and assemble a
  single, human-friendly sticky comment on the PR (Changes / Test coverage /
  Deployment).

inputs:
  environment:
    description: "Environment the PR deploys to"
    required: true
  phase:
    description: "validate (pre-approval, check-only) or deploy (post-approval, real deploy)"
    required: false
    default: "deploy"
  bypass:
    description: "true = admin bypassed the coverage gate for this PR"
    required: false
    default: "false"
  validate_result:
    required: false
    default: ""
  has_changes:
    required: false
    default: ""
  deploy_outcome:
    required: false
    default: ""
  github_token:
    description: "Token used to post the comment"
    required: false
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - name: Download change manifest
      uses: actions/download-artifact@v4
      continue-on-error: true
      with:
        name: manifest-${{ inputs.environment }}
        path: dl/manifest
    - name: Download change manifest (always-run)
      uses: actions/download-artifact@v4
      continue-on-error: true
      with:
        name: pr-manifest-${{ inputs.environment }}
        path: dl/manifest2
    - name: Download deployment report
      uses: actions/download-artifact@v4
      continue-on-error: true
      with:
        name: deploy-report-${{ inputs.environment }}
        path: dl/deploy
    - name: Download env comparison (informational)
      uses: actions/download-artifact@v4
      continue-on-error: true
      with:
        name: envcompare-${{ inputs.environment }}
        path: dl/envcompare

    - name: Assemble & post pipeline report
      uses: actions/github-script@v7
      env:
        ENVIRONMENT: ${{ inputs.environment }}
        PHASE: ${{ inputs.phase }}
        BYPASS: ${{ inputs.bypass }}
        VALIDATE_RESULT: ${{ inputs.validate_result }}
        HAS_CHANGES: ${{ inputs.has_changes }}
        DEPLOY_OUTCOME: ${{ inputs.deploy_outcome }}
      with:
        github-token: ${{ inputs.github_token }}
        script: |
          const fs = require('fs');
          const env = process.env.ENVIRONMENT || 'int';
          const read = (p) => { try { return fs.readFileSync(p, 'utf8'); } catch { return ''; } };
          const readJson = (p) => { try { return JSON.parse(fs.readFileSync(p, 'utf8')); } catch { return {}; } };

          // ---- Gather inputs from the artifacts ----------------------------
          const manifestMd = (read(`dl/manifest2/manifest-${env}.md`)
            || read(`dl/manifest/manifest-${env}.md`)).trim();
          const envCompareMd = read(`dl/envcompare/envcompare-${env}.md`).trim();
          const deployMd = read('dl/deploy/errors.md').trim();
          const deployReport = readJson('dl/deploy/report.json');

          const hasChanges = process.env.HAS_CHANGES === 'true';
          const bypassed = process.env.BYPASS === 'true';
          const phase = process.env.PHASE || 'deploy'; // 'validate' | 'deploy'
          const isDeployPhase = phase === 'deploy';

          // Coverage comes from the deploy step (report.json).
          const covPct = deployReport.coverage_percent;
          const covPass = deployReport.coverage_pass === true;
          const covMeasured = deployReport.coverage_measured === true;
          const covPerClass = Array.isArray(deployReport.coverage_per_class)
            ? deployReport.coverage_per_class : [];
          const covThreshold = deployReport.coverage_threshold ?? 85;
          const covWarnings = Number(deployReport.coverage_warnings || 0);
          const skipped = Array.isArray(deployReport.skipped_deletions)
            ? deployReport.skipped_deletions : [];

          const validateResult = process.env.VALIDATE_RESULT || '';
          const validateSkipped = validateResult === 'skipped';
          const deployOutcome = process.env.DEPLOY_OUTCOME
            || deployReport.status
            || (validateResult === 'success' ? (hasChanges ? 'success' : 'no_changes')
                : validateSkipped ? 'skipped' : 'failure');
          const deployFailed = deployOutcome === 'failure';

          const pill = (o) => ({
            success: '🟢 Passed', failure: '🔴 Failed',
            skipped: '⚪ Skipped', cancelled: '🚫 Cancelled',
          }[o] || `⚪ ${o || 'n/a'}`);

          // ==== HERO BANNER =================================================
          let hero;
          if (deployFailed) {
            hero = isDeployPhase
              ? `### 🔴 Deployment to \`${env}\` failed\nSalesforce rejected the deployment. `
                + 'See **section 3** for the exact errors to fix.'
              : `### 🔴 Validation against \`${env}\` failed\nSalesforce rejected the change. `
                + 'See **section 3** for the exact errors to fix.';
          } else if (isDeployPhase) {
            hero = `### 🟢 Deployed to \`${env}\` and merged\n`
                 + 'The approved changes were deployed to the org and the PR was merged automatically.';
          } else {
            hero = `### 🟢 Validated against \`${env}\` — ready for approval\n`
                 + 'The change deploys cleanly. **A reviewer approval will '
                 + 'deploy it for real and merge automatically.**';
          }
          if (bypassed) {
            hero = '### 🟡 Coverage gate bypassed by an admin\n'
                 + 'The Apex coverage gate was skipped for this PR.\n\n' + hero;
          }

          // ==== SECTION 1 — CHANGES ========================================
          let s1 = '## 1️⃣ What’s changing in this PR\n\n';
          if (!hasChanges) {
            s1 += '_No deployable Salesforce components were detected in this change._\n';
          } else if (manifestMd) {
            s1 += manifestMd.replace(/^##.*\n/, '').trim() + '\n';
          } else {
            s1 += '_Changes detected, but the component list could not be loaded._\n';
          }
          if (envCompareMd) {
            s1 += `\n<details><summary>🔎 How this branch compares to <code>${env}</code> `
                + '(informational — not what deploys)</summary>\n\n'
                + '_The deploy above is the delta vs **Prod** (the safe, promoted artifact). '
                + `This section just shows how the branch differs from the <code>${env}</code> `
                + 'branch, for your visibility._\n\n'
                + envCompareMd.replace(/^#.*\n/, '').trim() + '\n\n</details>\n';
          }

          // ==== SECTION 2 — TEST COVERAGE ==================================
          // "Not run (no Apex)" only when the delta really has no Apex: a deploy
          // Salesforce rejected before reporting coverage is not the same thing.
          let covCell;
          if (bypassed) covCell = '⚪ Bypassed';
          else if (covMeasured && covPct != null) covCell = `${covPass ? '🟢' : '🔴'} ${covPct}% (min ${covThreshold}%)`;
          else if (covWarnings > 0) covCell = '🔴 Rejected by Salesforce — see section 3';
          else if (deployReport.has_apex !== true) covCell = '⚪ Not run (no Apex)';
          else if (deployReport.test_level === 'NoTestRun') covCell = '⚪ Not run (NoTestRun)';
          else covCell = deployFailed ? '⚪ Not measured — the deploy failed first' : '⚪ Not measured';

          let s2 = '## 2️⃣ Apex test coverage\n\n';
          if (bypassed) {
            s2 += '_An admin bypassed the coverage gate for this PR._\n\n';
          }
          s2 += '| Check | What it verifies | Result |\n|---|---|:--:|\n';
          s2 += `| **🧪 Apex test coverage** | At least ${covThreshold}% covered? | ${covCell} |\n`;

          // Per-class coverage for the Apex classes coming in with this PR.
          if (!bypassed && covPerClass.length) {
            s2 += '\n**Coverage of the incoming Apex classes**\n\n';
            s2 += '| Apex class | Coverage | Status |\n|---|:--:|:--:|\n';
            for (const r of covPerClass) {
              const has = r.percent != null;
              const ok = has && (r.percent + 1e-9 >= covThreshold);
              const pc = has ? `${r.percent}% (${r.covered}/${r.total})` : 'n/a';
              const st = !has ? '⚪ —' : (ok ? '🟢' : '🔴');
              s2 += `| \`${r.name}\` | ${pc} | ${st} |\n`;
            }
            s2 += `\n<sub>Minimum required: ${covThreshold}%.</sub>\n`;
          }

          // ==== SECTION 3 — DEPLOYMENT ======================================
          let s3 = `## 3️⃣ ${isDeployPhase ? 'Deployment' : 'Validation'} — \`${env}\`\n\n`;
          if (isDeployPhase) {
            s3 += '> The reviewer approved, so the change was **deployed to the `' + env
                + '` org** and the PR **merged automatically** on success.\n\n';
          } else {
            s3 += '> Before approval the change is **validated (check-only) against the `' + env
                + '` org**. When a reviewer approves, it deploys for real and merges automatically — '
                + 'no manual steps.\n\n';
          }
          if (!hasChanges) {
            s3 += '⚪ **Nothing to deploy** — no Salesforce components changed.\n';
          } else if (deployOutcome === 'success') {
            s3 += isDeployPhase
              ? `🟢 **Deployed to \`${env}\` and merged.**\n`
              : `🟢 **Validated against \`${env}\`** — waiting for a reviewer approval to deploy & merge.\n`;
          } else if (deployFailed) {
            s3 += (deployMd || `🔴 **${isDeployPhase ? 'Deployment' : 'Validation'} failed** for \`${env}\`. See the run logs for details.`) + '\n';
          } else if (validateSkipped) {
            s3 += '⏭️ **' + (isDeployPhase ? 'Deployment' : 'Validation') + ' was skipped.** '
                + 'Push again and it will run automatically.\n';
          } else {
            s3 += 'ℹ️ Status unavailable.\n';
          }
          // On failure the deploy report above already lists them.
          if (skipped.length && !deployFailed) {
            s3 += `\n**⏭️ Deletions skipped — not in \`${env}\` (${skipped.length})**\n\n`
                + '_The org no longer has these, so there was nothing to delete._\n\n'
                + '| Type | Component |\n|---|---|\n';
            for (const s of skipped) {
              s3 += `| \`${s.type}\` | ${String(s.member || '').replace(/\|/g, '\\|')} |\n`;
            }
          }

          // ==== ASSEMBLE ====================================================
          const marker = '<!-- sf-pipeline-report -->';
          const sha = context.payload.pull_request.head.sha.substring(0, 7);
          const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
          let body = `${marker}\n# 🚀 Salesforce Pipeline Report\n\n${hero}\n\n---\n\n`
                   + `${s1}\n---\n\n${s2}\n---\n\n${s3}\n`
                   + `\n---\n<sub>Automated report for commit \`${sha}\` · `
                   + `[full run details](${runUrl}) · updates automatically on each push</sub>`;

          const { data: comments } = await github.rest.issues.listComments({
            owner: context.repo.owner, repo: context.repo.repo,
            issue_number: context.issue.number,
          });
          for (const old of ['<!-- sf-quality-report -->', '<!-- sf-pipeline-manifest -->']) {
            const c = comments.find(c => c.body && c.body.includes(old));
            if (c) { try { await github.rest.issues.deleteComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: c.id }); } catch {} }
          }
          const existing = comments.find(c => c.body && c.body.includes(marker));
          if (existing) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner, repo: context.repo.repo,
              comment_id: existing.id, body });
          } else {
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number, body });
          }

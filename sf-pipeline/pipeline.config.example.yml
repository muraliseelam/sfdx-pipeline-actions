# ============================================================================
#  Salesforce DevOps Pipeline — single source of truth
# ============================================================================
#  This is the ONLY file you edit to stand the pipeline up on a new project.
#  Everything else in sf-pipeline/ is generic and reused as-is.
#
#  See sf-pipeline/README.md for the full setup checklist (branches, GitHub
#  Environments, secrets). Change the values below to match your project.
#
#  For a pull request, the gates and environments below are read from the
#  branch the PR targets (if it is protected; otherwise the default branch),
#  never from the PR itself — so a change to this file applies to PRs into a
#  branch once it has merged there. Only source_path, api_version and
#  node_version come from the change being shipped.
# ============================================================================

# ---- Project basics --------------------------------------------------------
source_path: force-app        # Root of your Salesforce metadata (sfdx format)
api_version: "66.0"           # Metadata API version used for the delta package
node_version: "22"            # Node version for the CLI + LWC Jest

# Production baseline: the branch that represents what production currently has.
baseline_branch: main

# What each deploy's delta is computed against:
#   prod    — always against `baseline_branch`, so every environment receives the
#             complete change set relative to production. Safest default.
#   target  — against the PR's own target branch, so a deploy carries only what
#             that specific branch is missing. Smaller packages, but an
#             environment can drift from production.
delta_baseline: prod

# ---- Salesforce org naming (only needed for Org Bootstrap) ----------------
# Lets the bootstrap tooling derive each org's login URL and integration
# username instead of you typing them per environment. Delete this block if you
# set `instance_url:` and `integration_username:` on each environment by hand.
#
#   sandbox URL  -> https://{prod_org}--{sandbox}.sandbox.my.salesforce.com
#   sandbox user -> {username_base}.{sandbox}
org:
  prod_org: acme                          # your production My Domain, before --sandbox
  username_base: "pipeline.user@acme.com" # integration user; sandboxes append ".{sandbox}"

# ---- Promotion chain (the automatic Int -> ... -> last part) ---------------
# List as many or as few environments as you have — 3, 4, or 5 all work with no
# other changes. Order = promotion order.
#
# Each environment maps 1:1 to a GitHub Environment (`gh_environment`) that holds
# that org's secrets (SF_CONSUMER_KEY / SF_USERNAME / SF_INSTANCE_URL / SF_JWT_KEY).
#
# `gate:` controls how each stage is driven (optional; sensible defaults below):
#   * auto      — every push to a PR into this branch runs a real deploy to its
#                 org and auto-merges with NO approval (and no PR Validation).
#                 Use for a low-friction dev entry. Needs the example deploy.yml
#                 caller's pull_request triggers (setup-branch-protection.sh gives
#                 an auto entry 0 required reviews so it can merge unattended).
#   * approval  — a PR into this branch runs a CHECK-ONLY validation + posts the
#                 component/coverage report; a reviewer APPROVING the PR then
#                 triggers the real deploy + auto-merge. Use for gated stages.
#   * on_demand — NOT PR-driven; deployed when someone adds a `deploy:<name>`
#                 label to the merged entry PR. Use for qa/stage.
# Defaults when `gate:` is omitted: the FIRST env falls back to the global
# `require_pr_approval` flag (approval if true, auto if false); every later env
# defaults to on_demand.
# `jira_status:` (optional) is the Jira status each stage transitions the linked
# story to after a successful deploy (requires notifications.jira + JIRA_* secrets).
#
# `name:` and `branch:` are independent. `name` is what appears in labels
# (`deploy:<name>`), commit statuses (`deploy-<name>`) and workflow inputs;
# `branch` is the actual git branch. They are the same below because that is the
# least surprising default, but if your pipeline branches are prefixed — say
# `pipeline/qa` — set `branch:` to that and leave `name: qa`.
environments:
  - name: dev
    branch: dev
    gh_environment: dev
    gate: auto                      # feature PR -> auto-deploy + auto-merge
    test_level: RunSpecifiedTests   # optional; defaults to RunSpecifiedTests
    jira_status: In Dev             # optional; moves the story here after deploy
  - name: int
    branch: int
    gh_environment: int
    gate: approval                  # dev PR -> validate + report; approve -> deploy
    jira_status: In Int
  - name: qa
    branch: qa
    gh_environment: qa
    gate: on_demand                 # deployed by a deploy:qa label
    jira_status: In QA
  - name: stage
    branch: stage
    gh_environment: stage
    gate: on_demand                 # deployed by a deploy:stage label
    jira_status: In Stage

# ---- Production (isolated, manual, reviewer-gated) -------------------------
# Remove this whole block if a project has no separate prod flow.
production:
  branch: main               # branch that represents production
  deploy_environment: prod              # GitHub Environment WITH required reviewers
  validate_environment: prod-validate   # GitHub Environment WITHOUT reviewers (check-only)
  release_branch_prefix: "release/"     # weekly release branches
  test_level: RunSpecifiedTests

  # How the production org itself is addressed. Three mutually exclusive modes:
  #   A) a SANDBOX acting as production (common for training / pilot projects):
  #        is_sandbox: true
  #        sandbox: acmeprod
  #   B) a REAL production org — the default:
  #        is_sandbox: false
  #   C) explicit override, ignoring the `org:` block entirely:
  #        instance_url: https://acme.my.salesforce.com
  #        integration_username: pipeline.user@acme.com
  is_sandbox: false

  # Canary test(s) for a PRODUCTION destructive / no-Apex deploy. Production
  # forbids NoTestRun whenever Apex is involved (including deletions), so a
  # destructive-only change must still run a test. A deletion has no coverage
  # requirement, so a single stable passing test satisfies the platform without
  # running the whole (possibly red) org suite. Comma-separated; blank =
  # RunLocalTests. The release validation of a no-Apex change runs it too, so
  # that validation can be quick-deployed; without it, the approved release is
  # deployed again with a full deploy.
  # Replace with the name of a small, stable, always-passing Apex test class in
  # YOUR org. Leave blank if you do not have one.
  destructive_tests: "MyStableSmokeTest"

  # Label the release train gathers PRs by. Defaults to `deployed:<name of the
  # last environment above>`, so renaming your final pre-production stage needs
  # no change here. Override only if you stamp a label the pipeline did not
  # generate.
  # release_label: "deployed:stage"

# ---- Quality gates --------------------------------------------------------
# Static code analysis (PMD / SonarQube) is handled by your organisation's dedicated
# GitHub Actions from the internal marketplace — it is NOT part of this
# pipeline. The only gate enforced here is Apex test coverage, which fires only
# when *.cls / *.trigger change and judges a validation with the tests BEFORE
# anything is deployed.
quality_gates:
  apex_coverage: true  # fail the deploy if changed Apex is below the threshold

# Minimum aggregate Apex code coverage (%) required by the apex_coverage gate.
coverage_threshold: 85

# ---- Deployment options ----------------------------------------------------
# How Profiles / Permission Sets are deployed (REQ-006):
#   full         (default) — deploy the COMPLETE profile/permission-set from
#                source. Safest when every referenced component already exists in
#                the target org (baseline / full deploys).
#   incremental  — compare each profile/PS in the delta with the ref the delta
#                came from and deploy only the permission entries that were ADDED
#                or CHANGED (a file new on the branch deploys in full). Avoids
#                "component does not exist" failures on orgs that lag behind.
profiles_mode: full

# An admin can add this label to a PR to bypass the quality gates above when
# needed. The bypass is honored ONLY if the person who added the label has
# admin/maintain permission on the repo (verified at run time).
bypass_label: bypass-quality-gates

# May a PR's author approve its own ENTRY deploy with the `approved` label?
# Off by default: the label needs a repo admin who is not the PR's author (or a
# reviewer's Approve review). Working alone? Set it to true — on the entry
# branch, since that is where a PR's gates are read from (an admin can commit
# it there directly).
# allow_self_approval: false

# ---- Notifications ---------------------------------------------------------
notifications:
  chat: true           # Post deploy outcomes to a team chat channel.
                       # Supports Slack, Microsoft Teams, any JSON webhook, and
                       # token-based chat APIs. Configure ONE of:
                       #   * CHAT_WEBHOOK_URL  — an incoming webhook (Slack/Teams/
                       #     anything). The provider is auto-detected from the URL.
                       #   * CHAT_API_URL + CHAT_API_TOKEN + CHAT_CHANNEL_ID — a
                       #     bot-token chat API.
                       # Optionally set CHAT_PROVIDER to force one of:
                       #   slack | teams | generic | api
                       # Leave the secrets unset and this is a silent no-op.
                       # A chat failure NEVER fails a deploy — it only warns.
  jira: true           # needs JIRA_BASE_URL + JIRA_EMAIL + JIRA_API_TOKEN secrets.
                       # Links a story by an issue key in the feature branch name
                       # (e.g. feature/PROJ-123-foo). On each deploy the linked
                       # story is commented + transitioned to that env's
                       # `jira_status`. On-demand qa/stage promotions triggered
                       # from Jira pass the story key through automatically.

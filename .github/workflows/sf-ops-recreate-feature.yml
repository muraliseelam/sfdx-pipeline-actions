name: Ops — Recreate Feature Branch

# REQ-005.1 — Recreate a feature branch from the approved base.
#
# Creates (or cleanly resets) `feature/<name>` from the baseline branch so a
# corrupted / stale branch can be started fresh. Resetting an EXISTING branch is
# destructive, so it requires an explicit `confirm_reset: true`.
#
# Naming convention (REQ-003): the branch is always `feature/<name>`. Pass either
# a Jira key (e.g. ABC-123) or a slug; it is normalised to `feature/<name>`.

on:
  workflow_call:
    inputs:
      name:
        description: "Feature name or Jira key (branch becomes feature/<name>)"
        required: true
        type: string
      base:
        description: "Base branch to cut from (default: pipeline baseline)"
        required: false
        type: string
        default: ""
      confirm_reset:
        description: "If the branch already exists, reset it (DESTRUCTIVE)"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: recreate-${{ inputs.name }}
  cancel-in-progress: false

jobs:
  recreate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve baseline from pipeline config
        id: cfg
        uses: muraliseelam/sfdx-pipeline-actions/sf-pipeline/plan@v1.0.0
        with:
          mode: outputs

      - name: Recreate the feature branch
        env:
          GH_TOKEN: ${{ github.token }}
          RAW_NAME: ${{ inputs.name }}
          BASE_IN: ${{ inputs.base }}
          BASELINE: ${{ steps.cfg.outputs.baseline_branch }}
          CONFIRM: ${{ inputs.confirm_reset }}
        run: |
          set -euo pipefail

          # Normalise the branch name to feature/<name>.
          NAME="${RAW_NAME#feature/}"
          NAME="$(echo "$NAME" | tr ' ' '-' | tr -cd 'A-Za-z0-9._/-')"
          if [ -z "$NAME" ]; then
            echo "::error::Empty/invalid feature name."; exit 1
          fi
          BRANCH="feature/$NAME"

          BASE="${BASE_IN:-$BASELINE}"
          echo "Base branch:    $BASE"
          echo "Target branch:  $BRANCH"

          git config user.name  "sf-release-bot"
          git config user.email "sf-release-bot@users.noreply.github.com"
          git fetch origin --prune --no-tags

          if ! git ls-remote --exit-code --heads origin "$BASE" >/dev/null 2>&1; then
            echo "::error::Base branch '$BASE' does not exist."; exit 1
          fi
          BASE_SHA="$(git rev-parse "origin/$BASE")"

          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            if [ "$CONFIRM" != "true" ]; then
              echo "::error::Branch '$BRANCH' already exists. Re-run with confirm_reset=true to reset it (destructive)."
              exit 1
            fi
            echo "::warning::Resetting existing branch '$BRANCH' to $BASE ($BASE_SHA)."
            git push origin --force "$BASE_SHA:refs/heads/$BRANCH"
            ACTION="reset"
          else
            git push origin "$BASE_SHA:refs/heads/$BRANCH"
            ACTION="created"
          fi

          {
            echo "### 🌱 Feature branch $ACTION"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Branch | \`$BRANCH\` |"
            echo "| Base | \`$BASE\` @ \`${BASE_SHA:0:8}\` |"
            echo "| Action | $ACTION |"
            echo ""
            echo "Open a PR into the entry branch when ready — the pipeline validates it automatically."
          } >> "$GITHUB_STEP_SUMMARY"

name: SF Env Deploy

# Real delta deploy into a non-production org:
#   push to an environment branch (a PR was merged)  -> deploy that env's branch HEAD
#   label "deploy:<env>" on an open PR               -> pre-merge deploy of the PR head into <env>
#   manual dispatch                                  -> redeploy an environment branch
# Every run passes the approval guard (the PR behind the commit needs the env's
# required_approvals) and holds a per-org concurrency lock. Production is
# deployed only by sf-prod-release.yml.

on:
  push:
    branches: ["**"]
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      environment:
        description: Environment key from sf-pipeline/pipeline.config.yml (e.g. int)
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      run: ${{ steps.route.outputs.run }}
      env: ${{ steps.cfg.outputs.env }}
      cfg: ${{ steps.cfg.outputs.json }}
      sha: ${{ steps.route.outputs.sha }}
      pr: ${{ steps.route.outputs.pr }}
      label: ${{ steps.route.outputs.label }}
    steps:
      # Pushes read config from the (protected) env branch itself; label and
      # dispatch runs read it from the default branch, so a PR can't relax its
      # own approval guard or remap secret names.
      - name: Checkout pipeline files
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'push' && github.sha || github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: |
            .github/actions
            sf-pipeline

      - name: Load config
        id: cfg
        uses: ./.github/actions/load-config
        with:
          environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || '' }}
          branch: ${{ github.event_name == 'push' && github.ref_name || '' }}
          label: ${{ github.event_name == 'pull_request' && github.event.label.name || '' }}

      - name: Route
        id: route
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          FOUND: ${{ steps.cfg.outputs.found }}
          MATCHED_BY: ${{ steps.cfg.outputs.matched-by }}
          IS_PROD: ${{ fromJSON(steps.cfg.outputs.json).is_production }}
          BASELINE: ${{ fromJSON(steps.cfg.outputs.json).baseline_branch }}
          BRANCH: ${{ fromJSON(steps.cfg.outputs.json).branch }}
          SOURCE_PATH: ${{ fromJSON(steps.cfg.outputs.json).source_path }}
          PUSH_SHA: ${{ github.sha }}
          PUSH_DELETED: ${{ github.event.deleted }}
          PR_STATE: ${{ github.event.pull_request.state }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          LABEL: ${{ github.event.label.name }}
        run: |
          set -euo pipefail
          helpers=sf-pipeline/scripts/gh_helpers.py
          branch_sha() { gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/$1" --jq .object.sha; }
          run=true; sha=""; pr=""; reason=""; label=""
          if [ "$EVENT" = "pull_request" ] && [ "$MATCHED_BY" = "deploy" ]; then label="$LABEL"; fi
          if [ "$FOUND" != "true" ]; then
            run=false; reason="not an environment branch or deploy label"
          elif [ "$IS_PROD" = "true" ]; then
            run=false; reason="production is deployed only by SF Prod Release"
          else
            case "$EVENT" in
              push)
                if [ "$PUSH_DELETED" = "true" ]; then run=false; reason="branch deleted"
                else sha="$PUSH_SHA"; pr="$(python3 "$helpers" pr-for-commit --sha "$sha")"; fi ;;
              pull_request)
                if [ "$MATCHED_BY" != "deploy" ]; then run=false; reason="label is not a deploy label"
                elif [ "$PR_STATE" != "open" ]; then run=false; reason="PR #${PR_NUMBER} is not open"
                else sha="$PR_HEAD_SHA"; pr="$PR_NUMBER"; fi ;;
              workflow_dispatch)
                sha="$(branch_sha "$BRANCH")"; pr="$(python3 "$helpers" pr-for-commit --sha "$sha")" ;;
            esac
            if [ "$run" = "true" ] && [ "$sha" = "$(branch_sha "$BASELINE")" ]; then
              run=false; reason="${BRANCH} is identical to ${BASELINE} (new or just re-synced); nothing to deploy"
            fi
            if [ "$run" = "true" ]; then
              # Same range the deploy uses: merge-base(baseline, sha)..sha. The compare
              # API lists at most 300 files, so a full page counts as "changed".
              if ! counts="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${BASELINE}...${sha}" \
                    --jq "[(.files | length), ([.files[].filename | select(startswith(\"${SOURCE_PATH%/}/\"))] | length)] | @tsv")"; then
                echo "::warning title=SF Env Deploy::Couldn't compare ${BASELINE}...${sha:0:7}; deploying anyway (the delta step decides what changed)."
                counts="300 1"
              fi
              read -r total metadata <<<"$counts"
              if [ "${metadata:-0}" -eq 0 ] && [ "${total:-0}" -lt 300 ]; then
                run=false; reason="no changes under ${SOURCE_PATH} relative to ${BASELINE}; nothing to deploy"
              fi
            fi
          fi
          [ "$run" = "true" ] && reason="deploy ${sha:0:7} to ${BRANCH}'s org (PR ${pr:-none})"
          {
            echo "run=$run"
            echo "sha=$sha"
            echo "pr=$pr"
            echo "label=$label"
          } >> "$GITHUB_OUTPUT"
          echo "Plan: $reason"
          echo "**Plan:** $reason" >> "$GITHUB_STEP_SUMMARY"

  approval-guard:
    name: Approval guard
    needs: plan
    if: needs.plan.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout pipeline scripts (default branch)
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: sf-pipeline

      - name: Require an approved PR (label or reviews)
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ needs.plan.outputs.pr }}
          SHA: ${{ needs.plan.outputs.sha }}
          ENV_NAME: ${{ needs.plan.outputs.env }}
          REQUIRED: ${{ fromJSON(needs.plan.outputs.cfg).required_approvals }}
          LABEL: ${{ fromJSON(needs.plan.outputs.cfg).approval_label }}
        run: |
          if [ "$REQUIRED" -eq 0 ]; then
            echo "required_approvals is 0 for ${ENV_NAME}; guard passes"
            exit 0
          fi
          if [ -z "$PR" ]; then
            echo "::error title=Approval guard::${SHA:0:7} is not associated with a pull request; real deploys to ${ENV_NAME} need an approved PR."
            exit 1
          fi
          python3 sf-pipeline/scripts/gh_helpers.py approval --pr "$PR" --required "$REQUIRED" --label "$LABEL" --require

  deploy:
    name: Deploy
    needs: [plan, approval-guard]
    if: needs.plan.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment:
      name: ${{ fromJSON(needs.plan.outputs.cfg).github_environment }}
    # GitHub keeps one pending job per group and a newer one replaces it. Branch
    # deploys are cumulative (merge-base..branch HEAD), so the newest pending one
    # supersedes the older one safely. Label deploys get their own group so they
    # can never cancel a queued branch deploy; Salesforce serializes the org's
    # deploy queue either way.
    concurrency:
      group: sf-org-${{ fromJSON(needs.plan.outputs.cfg).org_alias }}${{ github.event_name == 'pull_request' && format('-pr-{0}', needs.plan.outputs.pr) || '' }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 0

      # Trusted, current pipeline code from the default branch; the env branch or PR supplies the metadata.
      - name: Use pipeline files from the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: git checkout "origin/${DEFAULT_BRANCH}" -- .github/actions sf-pipeline

      - name: sf CLI + JWT auth
        uses: ./.github/actions/sf-setup
        with:
          environment: ${{ needs.plan.outputs.env }}
          auth-url: ${{ secrets[fromJSON(needs.plan.outputs.cfg).auth_url_secret] }}
          username: ${{ secrets[fromJSON(needs.plan.outputs.cfg).username_secret] }}
          consumer-key: ${{ secrets[fromJSON(needs.plan.outputs.cfg).consumer_key_secret] }}
          jwt-key: ${{ secrets[fromJSON(needs.plan.outputs.cfg).jwt_key_secret] }}

      - name: Delta deploy
        id: deploy
        uses: ./.github/actions/deploy
        with:
          environment: ${{ needs.plan.outputs.env }}
          mode: deploy
          pr-number: ${{ github.event_name == 'pull_request' && needs.plan.outputs.pr || '' }}

      - name: Notify failure or cancellation
        if: failure() || cancelled()
        uses: ./.github/actions/notify
        with:
          enabled: ${{ fromJSON(needs.plan.outputs.cfg).webex_enabled }}
          webhook-url: ${{ secrets[fromJSON(needs.plan.outputs.cfg).webex_secret] }}
          message: >-
            ❌ **Salesforce deploy to `${{ needs.plan.outputs.env }}` ${{ job.status }}**
            (commit `${{ needs.plan.outputs.sha }}`, PR ${{ needs.plan.outputs.pr || 'n/a' }}).
            [Workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

  remove-label:
    name: Remove deploy label
    needs: [plan, approval-guard, deploy]
    # Runs even when the guard blocked the deploy, so re-adding the label re-triggers.
    if: always() && needs.plan.outputs.label != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Remove label
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ needs.plan.outputs.pr }}
          LABEL: ${{ needs.plan.outputs.label }}
        run: |
          encoded="$(jq -rn --arg l "$LABEL" '$l|@uri')"
          gh api -X DELETE "repos/${GITHUB_REPOSITORY}/issues/${PR}/labels/${encoded}" > /dev/null \
            || echo "::warning title=Remove label::Could not remove '${LABEL}' from PR #${PR}; remove it before re-adding."

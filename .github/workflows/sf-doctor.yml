name: SF Pipeline Doctor

# Logs in to every environment's org from GitHub Actions, using exactly the
# secrets and auth method the pipeline uses, and reports org, user and API
# headroom. It also checks the PAT. Run it after setting secrets, and weekly
# so an expired login is caught before a deploy hits it.

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"   # Mondays 06:17 UTC

permissions:
  contents: read

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sandboxes: ${{ steps.envs.outputs.sandboxes }}
      prod: ${{ steps.prod.outputs.json }}
    steps:
      - name: Checkout pipeline files
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/actions
            sf-pipeline

      - name: Load production config
        id: prod
        uses: ./.github/actions/load-config
        with:
          production: "true"

      - name: Non-production environments
        id: envs
        run: |
          sandboxes="$(python - <<'EOF'
          import json, sys
          sys.path.insert(0, "sf-pipeline/scripts")
          import pipeline_config as pc
          cfg = pc.load()
          print(json.dumps([n for n in cfg["promotion"]["chain"] if not cfg["environments"][n]["production"]]))
          EOF
          )"
          echo "sandboxes=$sandboxes" >> "$GITHUB_OUTPUT"
          echo "Checking: $sandboxes + production"

  sandbox:
    name: Login ${{ matrix.env }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        env: ${{ fromJSON(needs.plan.outputs.sandboxes) }}
    steps:
      - name: Checkout pipeline files
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/actions
            sf-pipeline
            sfdx-project.json

      - name: Load config
        id: cfg
        uses: ./.github/actions/load-config
        with:
          environment: ${{ matrix.env }}

      - name: sf CLI + org login
        id: login
        uses: ./.github/actions/sf-setup
        with:
          environment: ${{ matrix.env }}
          auth-url: ${{ secrets[fromJSON(steps.cfg.outputs.json).auth_url_secret] }}
          username: ${{ secrets[fromJSON(steps.cfg.outputs.json).username_secret] }}
          consumer-key: ${{ secrets[fromJSON(steps.cfg.outputs.json).consumer_key_secret] }}
          jwt-key: ${{ secrets[fromJSON(steps.cfg.outputs.json).jwt_key_secret] }}

      - name: Org report
        env:
          ENV_NAME: ${{ matrix.env }}
          ALIAS: ${{ steps.login.outputs.org-alias }}
          USERNAME: ${{ steps.login.outputs.username }}
          ORG_ID: ${{ steps.login.outputs.org-id }}
          URL: ${{ steps.login.outputs.instance-url }}
          AUTH: ${{ fromJSON(steps.cfg.outputs.json).auth_method }}
        run: |
          api="$(sf org list limits --target-org "$ALIAS" --json \
            | jq -r '.result[] | select(.name=="DailyApiRequests") | "\(.remaining)/\(.max)"')"
          line="| ${ENV_NAME} | ✅ | ${AUTH} | ${USERNAME} | ${ORG_ID} | ${URL} | ${api:-?} |"
          echo "$line"
          {
            echo "| Env | Login | Auth | User | Org ID | Instance | API left |"
            echo "|---|---|---|---|---|---|---|"
            echo "$line"
          } >> "$GITHUB_STEP_SUMMARY"

  production:
    name: Login production
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: ${{ fromJSON(needs.plan.outputs.prod).validation_environment }}
    steps:
      - name: Checkout pipeline files
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/actions
            sf-pipeline
            sfdx-project.json

      - name: sf CLI + org login
        id: login
        uses: ./.github/actions/sf-setup
        with:
          environment: ${{ fromJSON(needs.plan.outputs.prod).env }}
          auth-url: ${{ secrets[fromJSON(needs.plan.outputs.prod).auth_url_secret] }}
          username: ${{ secrets[fromJSON(needs.plan.outputs.prod).username_secret] }}
          consumer-key: ${{ secrets[fromJSON(needs.plan.outputs.prod).consumer_key_secret] }}
          jwt-key: ${{ secrets[fromJSON(needs.plan.outputs.prod).jwt_key_secret] }}

      - name: Org report
        env:
          ENV_NAME: ${{ fromJSON(needs.plan.outputs.prod).env }}
          ALIAS: ${{ steps.login.outputs.org-alias }}
          USERNAME: ${{ steps.login.outputs.username }}
          ORG_ID: ${{ steps.login.outputs.org-id }}
          URL: ${{ steps.login.outputs.instance-url }}
          AUTH: ${{ fromJSON(needs.plan.outputs.prod).auth_method }}
        run: |
          api="$(sf org list limits --target-org "$ALIAS" --json \
            | jq -r '.result[] | select(.name=="DailyApiRequests") | "\(.remaining)/\(.max)"')"
          line="| ${ENV_NAME} (production) | ✅ | ${AUTH} | ${USERNAME} | ${ORG_ID} | ${URL} | ${api:-?} |"
          echo "$line"
          {
            echo "| Env | Login | Auth | User | Org ID | Instance | API left |"
            echo "|---|---|---|---|---|---|---|"
            echo "$line"
          } >> "$GITHUB_STEP_SUMMARY"

  tokens:
    name: Token check
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The admin token may live only in the protected validation environment.
    environment:
      name: ${{ fromJSON(needs.plan.outputs.prod).validation_environment }}
    steps:
      - name: Pipeline PAT (PRs, auto-merge)
        env:
          GH_TOKEN: ${{ secrets[fromJSON(needs.plan.outputs.prod).pat_secret] }}
          NAME: ${{ fromJSON(needs.plan.outputs.prod).pat_secret }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error title=PAT::${NAME} is not set (bootstrap.py secrets --pat-from-gh or --pat-stdin)"
            exit 1
          fi
          push="$(gh api "repos/${GITHUB_REPOSITORY}" --jq .permissions.push 2>/dev/null || echo false)"
          if [ "$push" != "true" ]; then
            echo "::error title=PAT::${NAME} can't write to ${GITHUB_REPOSITORY} (needs Contents, Pull requests, Workflows: write)"
            exit 1
          fi
          echo "✅ ${NAME} can write to ${GITHUB_REPOSITORY}" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Admin token (env-branch sync)
        env:
          GH_TOKEN: ${{ secrets[fromJSON(needs.plan.outputs.prod).admin_pat_secret] }}
          NAME: ${{ fromJSON(needs.plan.outputs.prod).admin_pat_secret }}
          BASELINE: ${{ fromJSON(needs.plan.outputs.prod).baseline_branch }}
          VALIDATION_ENV: ${{ fromJSON(needs.plan.outputs.prod).validation_environment }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error title=Admin token::${NAME} is not set (repository or ${VALIDATION_ENV} environment)"
            exit 1
          fi
          # Reading branch protection needs Administration rights, exactly what the sync uses.
          if ! gh api "repos/${GITHUB_REPOSITORY}/branches/${BASELINE}/protection" > /dev/null 2>"$RUNNER_TEMP/err"; then
            if grep -q "not protected" "$RUNNER_TEMP/err"; then
              echo "::warning title=Admin token::${BASELINE} isn't protected yet (bootstrap.py github)"
            else
              echo "::error title=Admin token::${NAME} can't read branch protection: $(cat "$RUNNER_TEMP/err")"
              exit 1
            fi
          fi
          echo "✅ ${NAME} can manage branch protection" | tee -a "$GITHUB_STEP_SUMMARY"

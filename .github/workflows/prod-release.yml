name: Prod Release

# ONE production file. Two actions, selected by the `action` input:
#
#   action: assemble  → build/refresh release/<version> from the prod branch and
#                       merge in the commit each story really deployed to every
#                       stage (proven by the pipeline's deploy-<env> statuses).
#                       A human then opens the release → prod PR.
#   action: release   → preflight (release PR authorized + green) → validate
#                       (check-only against prod-validate) → [prod reviewer gate]
#                       → quick-deploy to prod → merge the PR, tag, GitHub Release,
#                       and realign the env branches. (default)
#
# Every branch/env name comes from sf-pipeline/pipeline.config.yml.

on:
  workflow_call:
    inputs:
      action:
        description: "assemble | release"
        type: string
        required: false
        default: "release"
      version:
        description: "Release version (e.g. 2026.31). Assemble: blank = ISO year.week."
        type: string
        required: false
        default: ""
      stories:
        description: "Assemble only: explicit space/comma-separated story branches (else auto-gather). Each must still be proven deployed to every stage."
        type: string
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: prod-release
  cancel-in-progress: false

jobs:
  # ---- Read config (one source of truth for branch/env names) -----------------
  plan:
    runs-on: ubuntu-latest
    outputs:
      ref:                ${{ steps.ref.outputs.ref }}
      baseline_branch:    ${{ steps.cfg.outputs.baseline_branch }}
      source_path:        ${{ steps.cfg.outputs.source_path }}
      api_version:        ${{ steps.cfg.outputs.api_version }}
      node_version:       ${{ steps.cfg.outputs.node_version }}
      profiles_mode:      ${{ steps.cfg.outputs.profiles_mode }}
      prod_branch:        ${{ steps.cfg.outputs.prod_branch }}
      prod_deploy_env:    ${{ steps.cfg.outputs.prod_deploy_env }}
      prod_validate_env:  ${{ steps.cfg.outputs.prod_validate_env }}
      prod_test_level:    ${{ steps.cfg.outputs.prod_test_level }}
      prod_destructive_tests: ${{ steps.cfg.outputs.prod_destructive_tests }}
      release_prefix:     ${{ steps.cfg.outputs.release_prefix }}
      release_label:      ${{ steps.cfg.outputs.release_label }}
      chain_statuses:     ${{ steps.ref.outputs.chain_statuses }}
      env_branches:       ${{ steps.cfg.outputs.env_branches }}
      chat:               ${{ steps.cfg.outputs.chat }}
    steps:
      - uses: actions/checkout@v4
      - id: cfg
        uses: muraliseelam/sfdx-pipeline-actions/sf-pipeline/plan@main
        with: { mode: outputs }
      # Every earlier stage of the last env: a release candidate must have really
      # deployed to each one, not only to the last.
      - id: last
        uses: muraliseelam/sfdx-pipeline-actions/sf-pipeline/plan@main
        with: { mode: prdeploy, arg: "${{ steps.cfg.outputs.last_env }}" }
      # The version is typed by whoever dispatches the run: it reaches the shell
      # through env only, and must be a plain name.
      - id: ref
        env:
          EARLIER: ${{ steps.last.outputs.r_require_envs }}
          LAST_ENV: ${{ steps.cfg.outputs.last_env }}
          RELEASE_PREFIX: ${{ steps.cfg.outputs.release_prefix }}
          VERSION: ${{ inputs.version }}
        run: |
          case "$VERSION" in *[!A-Za-z0-9._-]*) echo "::error::version '$VERSION' may use only letters, digits and . _ -"; exit 1 ;; esac
          echo "ref=${RELEASE_PREFIX}${VERSION}" >> "$GITHUB_OUTPUT"
          S=""; for e in ${EARLIER//,/ } $LAST_ENV; do S="${S:+$S,}deploy-$e"; done
          echo "chain_statuses=$S" >> "$GITHUB_OUTPUT"

  # ===========================================================================
  #  action: assemble — build the release branch
  # ===========================================================================
  assemble:
    if: ${{ inputs.action == 'assemble' }}
    needs: plan
    runs-on: ubuntu-latest
    # statuses: read — release-gather proves each story by its deploy-<env> statuses.
    permissions:
      contents: write
      pull-requests: write
      statuses: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.prod_branch }}
          fetch-depth: 0
      - name: Determine version + configure git
        id: ver
        env:
          RELEASE_PREFIX: ${{ needs.plan.outputs.release_prefix }}
          VERSION: ${{ inputs.version }}
        run: |
          V="$VERSION"; [ -z "$V" ] && V="$(date -u +%G.%V)"
          echo "version=$V"          >> "$GITHUB_OUTPUT"
          echo "branch=${RELEASE_PREFIX}$V" >> "$GITHUB_OUTPUT"
          git config user.name  "sf-release-bot"
          git config user.email "sf-release-bot@users.noreply.github.com"
      # An explicit `stories` list only narrows the gather: every story, named or
      # not, must be proven deployed to every stage by the pipeline itself.
      - name: Gather stories (proven deployed to every environment)
        id: gather
        uses: muraliseelam/sfdx-pipeline-actions/sf-pipeline/release-gather@main
        with:
          label: ${{ needs.plan.outputs.release_label }}
          baseline: ${{ needs.plan.outputs.prod_branch }}
          stories: ${{ inputs.stories }}
          require_statuses: ${{ needs.plan.outputs.chain_statuses }}
          github_token: ${{ github.token }}
      - name: Build release branch + merge stories
        id: build
        env:
          PROD_BRANCH: ${{ needs.plan.outputs.prod_branch }}
          BR: ${{ steps.ver.outputs.branch }}
          STORIES: ${{ steps.gather.outputs.stories }}
          SHAS: ${{ steps.gather.outputs.shas }}
          HELD: ${{ steps.gather.outputs.held }}
          MERGES: ${{ steps.gather.outputs.merges }}
          ENV_BRANCHES: ${{ needs.plan.outputs.env_branches }}
          RELEASE_PREFIX: ${{ needs.plan.outputs.release_prefix }}
        run: |
          set -euo pipefail
          read -ra S <<< "${STORIES:-}"; read -ra H <<< "${SHAS:-}"
          if [ "${#S[@]}" -eq 0 ] || [ "${#S[@]}" -ne "${#H[@]}" ]; then
            echo "::error::release-gather returned no stories, or stories and commits that don't line up."; exit 1
          fi
          echo "Release will include:"
          for i in "${!S[@]}"; do echo "  ${S[$i]} @ ${H[$i]:0:8}"; done
          git fetch origin --prune
          # Create or refresh release/<version> from the prod branch.
          OLD=""
          # Nothing but the proven commits may ship. An existing release branch can
          # hold older content (a story since put on hold or not proven, a hand
          # push): refuse it up front, before a merge conflict hides the cause.
          EXCL=("^origin/$PROD_BRANCH"); for h in "${H[@]}"; do EXCL+=("^$h"); done
          if git ls-remote --exit-code --heads origin "$BR" >/dev/null 2>&1; then
            OLD="$(git rev-parse "origin/$BR")"
            EXTRA="$(git rev-list --no-merges --abbrev-commit "origin/$BR" "${EXCL[@]}")"
            if [ -n "$EXTRA" ]; then
              echo "::error::$BR already contains commits that no story proven deployed to every stage accounts for: $(echo "$EXTRA" | xargs). Assemble a new version, or delete $BR and re-run."
              exit 1
            fi
            git checkout -B "$BR" "origin/$BR"; git merge --no-edit "origin/$PROD_BRANCH"
          else
            git checkout -B "$BR" "origin/$PROD_BRANCH"
          fi
          # A proven commit can hold other stories' work as its own ancestors, out
          # of reach of the commit checks here: merging (or rebasing on) an env
          # branch to settle a conflict brings in every story squashed there, held
          # or never selected. Refuse it, unless the commit is the squash of a story
          # that is in this release anyway.
          read -ra ENVS <<< "$(python3 -c 'import json,os; print(" ".join(json.loads(os.environ.get("ENV_BRANCHES") or "[]")))')"
          RIDE=""
          for i in "${!S[@]}"; do
            git cat-file -e "${H[$i]}^{commit}" 2>/dev/null || git fetch --quiet origin "${H[$i]}"
            for e in "${ENVS[@]}"; do
              if [ "$e" = "$PROD_BRANCH" ] || ! git rev-parse -q --verify "origin/$e" >/dev/null; then continue; fi
              C="$(comm -12 <(git rev-list --no-merges "${H[$i]}" "^origin/$PROD_BRANCH" | sort) \
                            <(git rev-list --no-merges "origin/$e" "^origin/$PROD_BRANCH" | sort) \
                   | grep -vxF -f <(tr ' ' '\n' <<< "${MERGES:-}") || true)"
              if [ -n "$C" ]; then
                RIDE="$RIDE"$'\n'"  ${S[$i]} @ ${H[$i]:0:8} has $(wc -l <<< "$C" | tr -d ' ') commit(s) of $e that $PROD_BRANCH doesn't:"$'\n'"$(git log --no-walk --format='    %h %s' --stdin <<< "$C")"
              fi
            done
          done
          if [ -n "$RIDE" ]; then
            echo "::error::A story's deployed commit carries work from an env branch that is not in this release; it would reach production without being gathered, or while on hold:$RIDE"
            echo "Release those stories too, or rebase the story on $PROD_BRANCH (not on an env branch), take it through the stages again, then re-run."
            exit 1
          fi
          # Merge the commit each story deployed, not its branch: a commit pushed
          # after the promotions never ran in any environment.
          for i in "${!S[@]}"; do
            s="${S[$i]}"; sha="${H[$i]}"
            git cat-file -e "${sha}^{commit}" 2>/dev/null || git fetch --quiet origin "$sha"
            git merge --no-edit -m "Merge $s at ${sha:0:8}" "$sha" || \
              { echo "::error::Merge conflict merging $s — rebase it on $PROD_BRANCH and re-run."; exit 1; }
          done
          # And after the merges: still nothing but those commits.
          EXTRA="$(git rev-list --no-merges --abbrev-commit HEAD "${EXCL[@]}")"
          if [ -n "$EXTRA" ]; then
            echo "::error::$BR contains commits that no story proven deployed to every stage accounts for: $(echo "$EXTRA" | xargs). Assemble a new version, or delete $BR and re-run."
            exit 1
          fi
          # Nor the content of a story on hold, whichever way it came in (a merge
          # of its branch, a cherry-pick): no file it changed may carry its version
          # here unless the prod branch already has that version.
          LEAK=""
          for b in ${HELD:-}; do
            # A release PR on hold is not a story.
            case "$b" in "${RELEASE_PREFIX:-release/}"*) continue ;; esac
            git rev-parse -q --verify "origin/$b" >/dev/null || continue
            MB="$(git merge-base "origin/$PROD_BRANCH" "origin/$b" || true)"
            [ -n "$MB" ] || continue
            while IFS= read -r f; do
              v="$(git rev-parse -q --verify "origin/$b:$f" || echo none)"
              if [ "$v" != "$(git rev-parse -q --verify "origin/$PROD_BRANCH:$f" || echo none)" ] && \
                 [ "$v" = "$(git rev-parse -q --verify "HEAD:$f" || echo none)" ]; then
                LEAK="$LEAK"$'\n'"  $b: $f"
              fi
            done < <(git diff --name-only "$MB" "origin/$b" --)
          done
          if [ -n "$LEAK" ]; then
            echo "::error::$BR would ship changes of stories on hold:$LEAK"
            echo "Take the held change out of the story that carries it (or lift the hold), then re-run."
            exit 1
          fi
          if [ "$(git rev-list --count "origin/$PROD_BRANCH..HEAD")" = "0" ]; then
            echo "::error::Nothing to release: $BR would be identical to $PROD_BRANCH."; exit 1
          fi
          git push origin "HEAD:$BR"
          if [ "$OLD" = "$(git rev-parse HEAD)" ]; then echo "changed=false" >> "$GITHUB_OUTPUT"; else echo "changed=true" >> "$GITHUB_OUTPUT"; fi
          {
            echo "| Story | Deployed commit released |"
            echo "|---|---|"
            for i in "${!S[@]}"; do echo "| \`${S[$i]}\` | \`${H[$i]:0:8}\` |"; done
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Summarize + release PR link
        env:
          GH_TOKEN: ${{ github.token }}
          PROD_BRANCH: ${{ needs.plan.outputs.prod_branch }}
          BR: ${{ steps.ver.outputs.branch }}
          VERSION: ${{ steps.ver.outputs.version }}
          CHANGED: ${{ steps.build.outputs.changed }}
        run: |
          set -euo pipefail
          EXISTING="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BR" --base "$PROD_BRANCH" --state open --json number --jq '.[0].number' || true)"
          COMPARE="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/${PROD_BRANCH}...${BR}?expand=1"
          # An authorization was given for the old content: take it back.
          REAUTH=""
          if [ -n "$EXISTING" ] && [ "$CHANGED" = "true" ] && \
             gh api -X DELETE "repos/$GITHUB_REPOSITORY/issues/$EXISTING/labels/prod-approved" >/dev/null 2>&1; then
            REAUTH="yes"
            gh pr comment "$EXISTING" --repo "$GITHUB_REPOSITORY" --body "🔄 Re-assembled with new content — \`prod-approved\` was removed. Review the change set again, then re-authorize." || true
          fi
          {
            echo "## Release v${VERSION} assembled on \`${BR}\`"
            if [ -n "$EXISTING" ]; then echo "➡️ Release PR already open: #${EXISTING}"
            else echo "➡️ **Open the release PR:** [${BR} → ${PROD_BRANCH}](${COMPARE})"; fi
            if [ -n "$REAUTH" ]; then echo ""; echo "⚠️ The release PR changed, so its \`prod-approved\` label was removed."; fi
            echo ""
            echo "Next: add the \`prod-approved\` label (or get an Approve review), then run **Prod Release** with action \`release\` and version \`${VERSION}\`."
          } >> "$GITHUB_STEP_SUMMARY"

  # ===========================================================================
  #  action: release — validate + deploy to production
  # ===========================================================================
  preflight:
    if: ${{ inputs.action == 'release' }}
    needs: plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      checks: read
      statuses: read
    outputs:
      pr_number: ${{ steps.pf.outputs.pr_number }}
      head_sha:  ${{ steps.pf.outputs.head_sha }}
    steps:
      - id: pf
        uses: muraliseelam/sfdx-pipeline-actions/sf-pipeline/release-preflight@main
        with:
          head_branch: ${{ needs.plan.outputs.ref }}
          base_branch: ${{ needs.plan.outputs.prod_branch }}
          version: ${{ inputs.version }}
          deployed_label: deployed:${{ needs.plan.outputs.prod_deploy_env }}
          github_token: ${{ github.token }}

  # Validation-only deploy to prod (captures a validated deploy id to quick-deploy).
  # Validate, deploy and merge all use the commit preflight authorized, so a push
  # to the release branch meanwhile can't slip into production or into main.
  validate:
    if: ${{ inputs.action == 'release' }}
    needs: [plan, preflight]
    runs-on: ubuntu-latest
    environment: ${{ needs.plan.outputs.prod_validate_env }}
    outputs:
      deploy_id: ${{ steps.deploy.outputs.deploy_id }}
      validated: ${{ steps.what.outputs.validated }}
      quick:     ${{ steps.what.outputs.quick }}
    steps:
      - name: Chat — validation starting
        if: ${{ needs.plan.outputs.chat == 'true' }}
        uses: muraliseelam/sfdx-pipeline-actions/sf-pipeline/notify@main
        with:
          message: "🚀 **Prod validation starting** for **v${{ inputs.version }}**. ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          webhook_url: ${{ secrets.CHAT_WEBHOOK_URL }}
          api_url:     ${{ secrets.CHAT_API_URL }}
          api_token:   ${{ secrets.CHAT_API_TOKEN }}
          channel_id:  ${{ secrets.CHAT_CHANNEL_ID }}
      - uses: actions/checkout@v4
        with: { ref: "${{ needs.preflight.outputs.head_sha }}", fetch-depth: 0 }
      # Three-dot, like every other stage: the release is cut from the prod
      # branch, so their merge-base is what assemble started from. A two-dot diff
      # against a prod branch that moved since (a hotfix, a rollback) turns every
      # component only it has into a DELETION, and production would delete it.
      - id: deploy
        uses: muraliseelam/sfdx-pipeline-actions/sf-pipeline/deploy@main
        with:
          environment: prod-validate
          ref: ${{ needs.plan.outputs.ref }}
          check_only: "true"
          test_level: ${{ needs.plan.outputs.prod_test_level }}
          destructive_test_names: ${{ needs.plan.outputs.prod_destructive_tests }}
          manifest_title: "Prod validation"
          baseline_branch: ${{ needs.plan.outputs.baseline_branch }}
          delta_merge_base: "true"
          source_path: ${{ needs.plan.outputs.source_path }}
          api_version: ${{ needs.plan.outputs.api_version }}
          node_version: ${{ needs.plan.outputs.node_version }}
          profiles_mode: ${{ needs.plan.outputs.profiles_mode }}
          sf_consumer_key: ${{ secrets.SF_CONSUMER_KEY }}
          sf_username: ${{ secrets.SF_USERNAME }}
          sf_instance_url: ${{ secrets.SF_INSTANCE_URL }}
          sf_jwt_key: ${{ secrets.SF_JWT_KEY }}
      # A delta without Apex is validated with a check-only deploy that runs no
      # tests (validation_id). Salesforce can't quick-deploy that, so after
      # approval the same delta is deployed again in full: say so to the reviewer.
      - name: Record what was validated
        id: what
        env:
          DEPLOY_ID: ${{ steps.deploy.outputs.deploy_id }}
          VALIDATION_ID: ${{ steps.deploy.outputs.validation_id }}
          HAS_CHANGES: ${{ steps.deploy.outputs.has_changes }}
          SHA: ${{ needs.preflight.outputs.head_sha }}
        run: |
          if [ -n "$DEPLOY_ID" ]; then
            { echo "validated=true"; echo "quick=true"; } >> "$GITHUB_OUTPUT"
            echo "✅ Validated ${SHA:0:8} against production — job \`$DEPLOY_ID\` is what gets quick-deployed after approval." >> "$GITHUB_STEP_SUMMARY"
          elif [ -n "$VALIDATION_ID" ]; then
            { echo "validated=true"; echo "quick=false"; } >> "$GITHUB_OUTPUT"
            MSG="Validated ${SHA:0:8} against production with a check-only deploy (job $VALIDATION_ID, no Apex tests). Salesforce can't quick-deploy a validation that ran no tests, so after approval the same delta is deployed again with a FULL deploy (atomic: if it fails, production is unchanged)."
            echo "::notice::$MSG"
            echo "✅ $MSG" >> "$GITHUB_STEP_SUMMARY"
          elif [ "$HAS_CHANGES" = "true" ]; then
            { echo "validated=false"; echo "quick=false"; } >> "$GITHUB_OUTPUT"
            MSG="Not validated against production: no check-only deploy ran. After approval, ${SHA:0:8} is deployed with a FULL deploy (atomic: if it fails, production is unchanged), not a quick deploy."
            echo "::warning::$MSG"
            echo "⚠️ $MSG" >> "$GITHUB_STEP_SUMMARY"
          else
            { echo "validated=true"; echo "quick=false"; } >> "$GITHUB_OUTPUT"
            echo "✅ Nothing to deploy for ${SHA:0:8}." >> "$GITHUB_STEP_SUMMARY"
          fi

  validate-notify:
    if: ${{ always() && inputs.action == 'release' && needs.plan.outputs.chat == 'true' }}
    needs: [plan, validate]
    runs-on: ubuntu-latest
    steps:
      - uses: muraliseelam/sfdx-pipeline-actions/sf-pipeline/notify@main
        with:
          # Skipped = preflight refused the release: nothing was validated.
          message: ${{ needs.validate.result == 'skipped' && format('⛔ **Prod release refused** for v{0} before validation (see preflight) — nothing was validated or deployed. {1}/{2}/actions/runs/{3}', inputs.version, github.server_url, github.repository, github.run_id) || needs.validate.result == 'success' && (needs.validate.outputs.validated == 'false' && format('⚠️ **Prod validation SKIPPED** for v{0} — awaiting deploy approval; the deploy will be a full deploy.', inputs.version) || format('✅ **Prod validation PASSED** for v{0} — awaiting deploy approval{1}.', inputs.version, needs.validate.outputs.quick == 'false' && ' (check-only, no Apex tests; the deploy will be a full deploy)' || '')) || format('❌ **Prod validation FAILED** for v{0}. {1}/{2}/actions/runs/{3}', inputs.version, github.server_url, github.repository, github.run_id) }}
          webhook_url: ${{ secrets.CHAT_WEBHOOK_URL }}
          api_url:     ${{ secrets.CHAT_API_URL }}
          api_token:   ${{ secrets.CHAT_API_TOKEN }}
          channel_id:  ${{ secrets.CHAT_CHANNEL_ID }}

  # Quick-deploy the validated id — gated by the prod environment reviewer.
  # No automatic fallback when Salesforce refuses the quick deploy: a client
  # timeout looks the same while the org keeps deploying, and a second deploy on
  # top would not be the artifact the reviewer approved. The run stops; see the
  # job summary for the safe retry.
  deploy:
    if: ${{ inputs.action == 'release' }}
    needs: [plan, preflight, validate]
    runs-on: ubuntu-latest
    environment: ${{ needs.plan.outputs.prod_deploy_env }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ needs.preflight.outputs.head_sha }}", fetch-depth: 0 }
      # The approval can come hours after preflight. If the prod branch moved
      # meanwhile (a hotfix or a rollback merged into it), this release doesn't
      # contain that change, and deploying it would overwrite it in production.
      - name: Prod branch unchanged since preflight
        env:
          PROD_BRANCH: ${{ needs.plan.outputs.prod_branch }}
          VERSION: ${{ inputs.version }}
        run: |
          git fetch --quiet origin "$PROD_BRANCH"
          if ! git merge-base --is-ancestor "origin/$PROD_BRANCH" HEAD; then
            echo "::error::$PROD_BRANCH has $(git rev-list --count "HEAD..origin/$PROD_BRANCH") commit(s) that v$VERSION doesn't (a hotfix or rollback merged after preflight). Deploying it would undo them in production. Nothing was deployed: run Prod Release with action assemble for v$VERSION, authorize the release PR again, then run release."
            exit 1
          fi
      # Same test settings as the validation, for the full deploy that runs when
      # there is no validated job (a delta without Apex).
      - uses: muraliseelam/sfdx-pipeline-actions/sf-pipeline/deploy@main
        with:
          environment: prod
          ref: ${{ needs.plan.outputs.ref }}
          check_only: "false"
          quick_deploy_id: ${{ needs.validate.outputs.deploy_id }}
          test_level: ${{ needs.plan.outputs.prod_test_level }}
          destructive_test_names: ${{ needs.plan.outputs.prod_destructive_tests }}
          manifest_title: "Prod deploy"
          baseline_branch: ${{ needs.plan.outputs.baseline_branch }}
          delta_merge_base: "true"
          source_path: ${{ needs.plan.outputs.source_path }}
          api_version: ${{ needs.plan.outputs.api_version }}
          node_version: ${{ needs.plan.outputs.node_version }}
          profiles_mode: ${{ needs.plan.outputs.profiles_mode }}
          sf_consumer_key: ${{ secrets.SF_CONSUMER_KEY }}
          sf_username: ${{ secrets.SF_USERNAME }}
          sf_instance_url: ${{ secrets.SF_INSTANCE_URL }}
          sf_jwt_key: ${{ secrets.SF_JWT_KEY }}
      # Production now runs this release: mark the PR so preflight refuses to
      # deploy it a second time if the run is repeated before finalize finishes.
      - name: Mark the release PR deployed
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ needs.preflight.outputs.pr_number }}
          LABEL: deployed:${{ needs.plan.outputs.prod_deploy_env }}
        run: |
          gh label create "$LABEL" --repo "$GITHUB_REPOSITORY" --color 0e8a16 \
            --description "Deployed to production by the release train" >/dev/null 2>&1 || true
          gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR/labels" -f "labels[]=$LABEL" >/dev/null \
            || echo "::warning::Could not add '$LABEL' to release PR #$PR — a repeated run of this release would not be refused."
      - name: Explain a failed production deploy
        if: ${{ failure() }}
        env:
          VERSION: ${{ inputs.version }}
          DEPLOY_ID: ${{ needs.validate.outputs.deploy_id }}
          LABEL: deployed:${{ needs.plan.outputs.prod_deploy_env }}
        run: |
          {
            echo "### ❌ Production deploy failed for v${VERSION} — nothing was merged or tagged"
            echo ""
            echo "Look at **Setup → Deployment Status** in production before retrying."
            echo ""
            echo "- **Nothing was deployed** (e.g. Salesforce refused the quick deploy of \`${DEPLOY_ID:-<none>}\`: older than 10 days, already used, or production changed since): run **Prod Release** again with action \`release\` and version \`${VERSION}\`. It validates again and asks for approval again. Re-running only this job reuses the old validation."
            echo "- **The deploy completed** in production anyway (e.g. the CLI timed out while Salesforce kept deploying): do **not** deploy again. Add \`${LABEL}\` to the release PR, merge it, tag \`v${VERSION}\` and run **Sync Env Branches** by hand."
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-notify:
    if: ${{ always() && inputs.action == 'release' && needs.plan.outputs.chat == 'true' && needs.deploy.result != 'skipped' }}
    needs: [plan, validate, deploy]
    runs-on: ubuntu-latest
    steps:
      - uses: muraliseelam/sfdx-pipeline-actions/sf-pipeline/notify@main
        with:
          message: ${{ needs.deploy.result == 'success' && format('✅ **Prod {0}** — v{1} is live. Deployed by @{2}.', needs.validate.outputs.validated == 'false' && 'DEPLOYED (full deploy, no prior validation)' || 'VALIDATED & DEPLOYED', inputs.version, github.actor) || format('❌ **Prod DEPLOY FAILED** for v{0} ({1}). {2}/{3}/actions/runs/{4}', inputs.version, needs.validate.outputs.validated == 'false' && 'no prior validation, no Apex' || 'validation had passed', github.server_url, github.repository, github.run_id) }}
          webhook_url: ${{ secrets.CHAT_WEBHOOK_URL }}
          api_url:     ${{ secrets.CHAT_API_URL }}
          api_token:   ${{ secrets.CHAT_API_TOKEN }}
          channel_id:  ${{ secrets.CHAT_CHANNEL_ID }}

  # Merge the release PR (post-deploy), tag, GitHub Release, realign env branches.
  finalize:
    if: ${{ inputs.action == 'release' }}
    needs: [plan, preflight, deploy]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ inputs.version }}
      BASELINE: ${{ needs.plan.outputs.baseline_branch }}
      PR_NUMBER: ${{ needs.preflight.outputs.pr_number }}
      HEAD_SHA: ${{ needs.preflight.outputs.head_sha }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Configure git
        run: |
          git config user.name  "sf-release-bot"
          git config user.email "sf-release-bot@users.noreply.github.com"
      # Re-runnable: an already-merged PR is not merged again.
      - name: Merge release PR (post-deploy), tag + GitHub Release
        id: publish
        run: |
          set -euo pipefail
          [ -n "${PR_NUMBER:-}" ] || { echo "::error::No release PR number from preflight."; exit 1; }
          if [ "$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json state --jq .state)" = "MERGED" ]; then
            echo "Release PR #$PR_NUMBER is already merged."
          # main must get exactly the commit production runs: GitHub refuses the
          # merge if the release branch moved after preflight.
          elif ! gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --merge --delete-branch --match-head-commit "$HEAD_SHA"; then
            echo "::error::Could not merge release PR #$PR_NUMBER at ${HEAD_SHA:0:8}, the commit now in production (see above). If the release branch changed after preflight, merge only ${HEAD_SHA:0:8} into $BASELINE."
            exit 1
          fi
          git fetch origin --prune --tags
          git checkout "$BASELINE"; git pull --ff-only origin "$BASELINE"
          if ! git ls-remote --exit-code --tags origin "refs/tags/v${VERSION}" >/dev/null 2>&1; then
            git tag -a "v${VERSION}" -m "Release v${VERSION}"; git push origin "v${VERSION}"
          fi
          if ! gh release view "v${VERSION}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "v${VERSION}" --title "Release v${VERSION}" --generate-notes --target "$BASELINE"
          fi
      - name: Realign env branches to the new baseline
        uses: muraliseelam/sfdx-pipeline-actions/sf-pipeline/sync-branches@main
        with:
          baseline_branch: ${{ needs.plan.outputs.baseline_branch }}
          env_branches: ${{ needs.plan.outputs.env_branches }}
          pipeline_pat: ${{ secrets.PIPELINE_PAT }}
          github_token: ${{ github.token }}
      - name: Chat — released
        if: ${{ !cancelled() && steps.publish.outcome == 'success' && needs.plan.outputs.chat == 'true' }}
        uses: muraliseelam/sfdx-pipeline-actions/sf-pipeline/notify@main
        with:
          message: "🎉 **Prod RELEASE published** — v${{ inputs.version }} is live, merged to `${{ needs.plan.outputs.baseline_branch }}`, tagged, and released. ${{ github.server_url }}/${{ github.repository }}/releases/tag/v${{ inputs.version }}"
          webhook_url: ${{ secrets.CHAT_WEBHOOK_URL }}
          api_url:     ${{ secrets.CHAT_API_URL }}
          api_token:   ${{ secrets.CHAT_API_TOKEN }}
          channel_id:  ${{ secrets.CHAT_CHANNEL_ID }}

name: Ops — Rollback (revert + redeploy)

# REQ-005.2 / REQ-016 — Revert previously deployed changes and restore the last
# known-good state.
#
# This creates a REVERT of the target change on a fresh branch and opens a pull
# request into the chosen base branch. The revert then flows through the SAME
# gated pipeline (validation → approval → real deploy → merge), so the rollback
# is validated, reviewed and audited exactly like any other change — nothing is
# force-deployed behind the pipeline's back.
#
# Target the change either by commit SHA (`ref`) or by merged PR number
# (`pr_number`). For a merge commit the first parent (-m 1) is used.

on:
  workflow_call:
    inputs:
      pr_number:
        description: "Merged PR number to revert (leave blank to use ref)"
        required: false
        type: string
        default: ""
      ref:
        description: "Commit SHA to revert (used when pr_number is blank)"
        required: false
        type: string
        default: ""
      base:
        description: "Branch to revert on (default: pipeline entry branch)"
        required: false
        type: string
        default: ""

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: rollback-${{ inputs.pr_number || inputs.ref }}
  cancel-in-progress: false

jobs:
  revert:
    runs-on: ubuntu-latest
    steps:
      # PIPELINE_PAT (when set) opens the revert PR as a person, so its PR
      # Validation starts on its own; GitHub doesn't start workflows for PRs the
      # workflow token opens (they wait for a maintainer's "Approve and run").
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PIPELINE_PAT || github.token }}

      - name: Resolve config
        id: cfg
        uses: muraliseelam/sfdx-pipeline-actions/sf-pipeline/plan@main
        with:
          mode: outputs

      - name: Create the revert branch + PR
        env:
          GH_TOKEN: ${{ secrets.PIPELINE_PAT || github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr_number }}
          REF_IN: ${{ inputs.ref }}
          BASE_IN: ${{ inputs.base }}
          ENTRY: ${{ steps.cfg.outputs.entry_branch }}
          BASELINE: ${{ steps.cfg.outputs.baseline_branch }}
        run: |
          set -euo pipefail

          BASE="${BASE_IN:-$ENTRY}"
          git config user.name  "sf-release-bot"
          git config user.email "sf-release-bot@users.noreply.github.com"
          git fetch origin --prune --no-tags

          if ! git ls-remote --exit-code --heads origin "$BASE" >/dev/null 2>&1; then
            echo "::error::Base branch '$BASE' does not exist."; exit 1
          fi

          # Resolve the commit to revert.
          if [ -n "$PR_NUMBER" ]; then
            # An open or closed-unmerged PR also has a merge_commit_sha (GitHub's
            # test merge): reverting it would "roll back" a change that never landed.
            MERGED="$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq '.merged')"
            SHA="$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq '.merge_commit_sha')"
            if [ "$MERGED" != "true" ] || [ -z "$SHA" ] || [ "$SHA" = "null" ]; then
              echo "::error::PR #$PR_NUMBER is not merged — there is nothing to roll back."; exit 1
            fi
            SRC_DESC="PR #$PR_NUMBER"
          elif [ -n "$REF_IN" ]; then
            # A commit SHA only: anything else (a branch name, an option) is not a change to revert.
            if ! [[ "$REF_IN" =~ ^[0-9a-fA-F]{7,40}$ ]]; then
              echo "::error::ref '$REF_IN' is not a commit SHA."; exit 1
            fi
            SHA="$REF_IN"
            SRC_DESC="commit ${SHA:0:8}"
          else
            echo "::error::Provide either pr_number or ref."; exit 1
          fi

          git fetch origin "$SHA" >/dev/null 2>&1 || true
          if ! SHA="$(git rev-parse --verify -q "${SHA}^{commit}")"; then
            echo "::error::Commit ${REF_IN:-$SHA} not found."; exit 1
          fi

          # Is it a merge commit? If so revert the first parent.
          PARENTS="$(git rev-list --parents -n 1 "$SHA" | wc -w)"
          MFLAG=""
          if [ "$PARENTS" -ge 3 ]; then MFLAG="-m 1"; fi

          SHORT="${SHA:0:8}"
          BRANCH="rollback/${SHORT}"

          # Cut the revert from the production baseline when it applies there:
          # the PR then carries ONLY the revert. Cut from $BASE, it also carries
          # every $BASE change production doesn't have yet — its deploy, and a
          # deploy:<env> promotion of it, would take all of them along.
          # No rename detection: a revert touches only the files the change
          # touched, never a look-alike metadata file elsewhere.
          revert_on() {  # $1 = branch to cut the revert from
            git checkout -q -B "$BRANCH" "origin/$1" || return 1
            # MFLAG is empty or "-m 1" and must split into separate words.
            # shellcheck disable=SC2086
            git revert --no-edit -X no-renames $MFLAG "$SHA" && return 0
            git revert --abort >/dev/null 2>&1 || true
            return 1
          }
          FROM="$BASELINE"
          if [ "$BASE" = "$BASELINE" ] || ! revert_on "$BASELINE"; then
            FROM="$BASE"
            if ! revert_on "$BASE"; then
              echo "::error::Revert of $SHA hit conflicts against '$BASE' (or changes nothing there). Resolve manually:"
              echo "  git checkout -B $BRANCH origin/$BASE && git revert -X no-renames $MFLAG $SHA"
              exit 1
            fi
          fi
          NOTE=""
          if [ "$FROM" != "$BASELINE" ]; then
            CARRIED="$(git diff --name-only "origin/$BASELINE...origin/$BASE" | wc -l | tr -d ' ')"
            if [ "$CARRIED" -gt 0 ]; then
              echo "::warning::$SRC_DESC does not revert cleanly on '$BASELINE' (never released, or changed there since), so the revert is cut from '$BASE' and also carries the $CARRIED file(s) '$BASE' has that '$BASELINE' doesn't. Do not promote it with a deploy:<env> label: that takes them all to the next stage."
              # shellcheck disable=SC2016
              NOTE="$(printf '\n\n> [!WARNING]\n> This change does not revert cleanly on `%s` (it never reached production, or production changed it since), so this revert is cut from `%s` and **also carries the %s file(s) `%s` has that `%s` does not**. Do not promote this PR with a `deploy:<env>` label: that would take all of them to the next stage. To keep the change out of production, put `hold` on its PR instead.' "$BASELINE" "$BASE" "$CARRIED" "$BASE" "$BASELINE")"
            fi
          fi

          git push origin "$BRANCH" --force-with-lease

          TITLE="Rollback: revert $SRC_DESC"
          # The backticks are literal Markdown, not command substitution.
          # shellcheck disable=SC2016
          BODY="$(printf 'Automated rollback (REQ-016). Reverts `%s` (%s) on top of `%s`.\n\nThis revert flows through the standard pipeline: validation -> approval -> real deploy -> merge. Approve to restore the last known-good state.%s' "$SHA" "$SRC_DESC" "$FROM" "$NOTE")"

          # The org may block Actions from opening PRs; fall back to a one-click link.
          if PR_URL="$(gh pr create --repo "$REPO" --base "$BASE" --head "$BRANCH" --title "$TITLE" --body "$BODY" 2>/tmp/prerr)"; then
            PR_LINE="- PR: $PR_URL"
          else
            echo "::warning::Could not auto-open PR ($(tr -d '\n' </tmp/prerr)). The revert branch is pushed — open the PR with the link below."
            PR_URL="$GITHUB_SERVER_URL/$REPO/compare/$BASE...$BRANCH?expand=1"
            PR_LINE="- Open PR (one click): $PR_URL"
          fi

          {
            echo "### ⏪ Rollback PR opened"
            echo ""
            echo "- Reverting: \`$SHA\` ($SRC_DESC)"
            echo "- Base: \`$BASE\` (revert cut from \`$FROM\`)"
            echo "- Revert branch: \`$BRANCH\`"
            echo "$PR_LINE"
            echo ""
            echo "Approve the PR to validate + deploy the rollback through the pipeline."
          } >> "$GITHUB_STEP_SUMMARY"

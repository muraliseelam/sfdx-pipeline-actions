name: SF PR Approval

# Posts the sf-approval status (required by branch protection) for every PR
# into an environment branch. A PR is approved when it carries the approval
# label (approvals.label, default "approved") or has enough approving reviews
# (the base env's required_approvals). New commits remove the label when
# approvals.dismiss_label_on_push is on. With approvals.auto_merge, an approved
# PR into a non-production env branch gets auto-merge (squash), so it merges
# as soon as validation is green. Config and scripts come from the default
# branch, so a PR can't change its own approval rules.

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled, edited, ready_for_review]
  pull_request_review:
    types: [submitted, dismissed, edited]

permissions:
  contents: read
  pull-requests: write
  statuses: write

concurrency:
  group: sf-pr-approval-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  approval:
    name: Approval
    # Closed/merged PRs are done; acting on them could re-post a status on a head
    # commit that another (open) PR shares.
    if: github.event.pull_request.state == 'open'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout pipeline files (default branch)
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: |
            .github/actions
            sf-pipeline

      - name: Load config for the base branch
        id: cfg
        uses: ./.github/actions/load-config
        with:
          branch: ${{ github.event.pull_request.base.ref }}

      - name: Remove the approval label after new commits
        if: >-
          steps.cfg.outputs.found == 'true' && github.event.action == 'synchronize' &&
          fromJSON(steps.cfg.outputs.json).dismiss_label_on_push == 'true' &&
          contains(github.event.pull_request.labels.*.name, fromJSON(steps.cfg.outputs.json).approval_label)
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          LABEL: ${{ fromJSON(steps.cfg.outputs.json).approval_label }}
        run: |
          python3 sf-pipeline/scripts/gh_helpers.py remove-label --pr "$PR" --label "$LABEL"
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" \
            --body "🔄 New commits were pushed, so the \`${LABEL}\` label was removed. Re-approve after review."

      - name: Post sf-approval status
        id: verdict
        if: always() && steps.cfg.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REQUIRED: ${{ fromJSON(steps.cfg.outputs.json).required_approvals }}
          LABEL: ${{ fromJSON(steps.cfg.outputs.json).approval_label }}
          CONTEXT: ${{ fromJSON(steps.cfg.outputs.json).approval_status_check }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 sf-pipeline/scripts/gh_helpers.py approval --pr "$PR" --required "$REQUIRED" --label "$LABEL" \
            --post-status "$CONTEXT" --target-url "$RUN_URL" --github-output

      - name: Enable auto-merge (squash)
        if: >-
          steps.verdict.outputs.approved == 'true' &&
          fromJSON(steps.cfg.outputs.json).approval_auto_merge == 'true' &&
          fromJSON(steps.cfg.outputs.json).is_production != 'true' &&
          github.event.pull_request.state == 'open' && !github.event.pull_request.draft
        env:
          # The PAT (not GITHUB_TOKEN) so the merge's push triggers SF Env Deploy.
          GH_TOKEN: ${{ secrets[fromJSON(steps.cfg.outputs.json).pat_secret] }}
          PAT_SECRET: ${{ fromJSON(steps.cfg.outputs.json).pat_secret }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning title=Auto-merge::${PAT_SECRET} isn't set; merge PR #${PR} manually (squash) once checks pass."
            exit 0
          fi
          # With checks already green, --auto merges at once, and GitHub refuses it with
          # "Base branch was modified" when another PR merged into the same branch a
          # moment earlier. Retry a few times before giving up.
          for attempt in 1 2 3 4 5; do
            if gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --auto --squash; then
              echo "Auto-merge (squash) enabled for PR #${PR}"
              exit 0
            fi
            state="$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json state --jq .state || echo unknown)"
            if [ "$state" != "OPEN" ]; then
              echo "PR #${PR} is ${state}; nothing to merge"
              exit 0
            fi
            sleep $((attempt * 5))
          done
          echo "::warning title=Auto-merge::Couldn't enable auto-merge on PR #${PR}; merge it manually once checks pass."

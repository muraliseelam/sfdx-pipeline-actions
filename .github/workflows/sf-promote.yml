name: SF Promote

# Label-driven promotion up the chain (dev -> int -> qa -> stage, from
# promotion.chain in pipeline.config.yml). Label a PR "promote:<env>" (before
# or after it merges) and, once merged, this opens a PR into <env>'s branch
# from promote/<env>/pr-<n>, pinned to the original head SHA. Feature branches
# are cut from main, so that SHA applies cleanly to every environment branch.
# PRs are opened with the pipeline PAT so that SF PR Validation runs on them.
# Production is promoted by SF Prod Release, never by a label.

on:
  pull_request:
    types: [closed, labeled]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Merged PR to promote
        required: true
        type: number
      target_env:
        description: Environment to promote into (e.g. qa)
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: sf-promote-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: false

jobs:
  plan:
    name: Plan
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write  # explain a rejected promotion label on the PR
    outputs:
      cfg: ${{ steps.cfg.outputs.json }}
      targets: ${{ steps.targets.outputs.targets }}
      count: ${{ steps.targets.outputs.count }}
      pr: ${{ steps.pr.outputs.number }}
      head_sha: ${{ steps.pr.outputs.head_sha }}
      title: ${{ steps.pr.outputs.title }}
      base_env: ${{ steps.targets.outputs.base_env }}
    steps:
      - name: Checkout pipeline files (default branch)
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: |
            .github/actions
            sf-pipeline

      - name: Load config
        id: cfg
        uses: ./.github/actions/load-config

      - name: Read PR
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number || inputs.pr_number }}
        run: |
          set -euo pipefail
          info="$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" \
            --json number,state,mergedAt,baseRefName,headRefOid,title,labels)"
          if [ "$(jq -r '.mergedAt // empty' <<<"$info")" = "" ]; then
            echo "::error title=SF Promote::PR #$PR is not merged; only merged changes are promoted."
            exit 1
          fi
          {
            echo "number=$(jq -r .number <<<"$info")"
            echo "base=$(jq -r .baseRefName <<<"$info")"
            echo "head_sha=$(jq -r .headRefOid <<<"$info")"
            echo "title=$(jq -r .title <<<"$info" | tr -d '\r\n')"
            echo "labels=$(jq -r '[.labels[].name] | join(",")' <<<"$info")"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve targets
        id: targets
        env:
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          BASE: ${{ steps.pr.outputs.base }}
          ALL_LABELS: ${{ steps.pr.outputs.labels }}
          NEW_LABEL: ${{ github.event.label.name }}
          TARGET: ${{ inputs.target_env }}
        run: |
          set -euo pipefail
          args=(--base-branch "$BASE")
          if [ "$EVENT" = "workflow_dispatch" ]; then args+=(--target "$TARGET")
          elif [ "$ACTION" = "labeled" ]; then args+=(--labels "$NEW_LABEL")
          else args+=(--labels "$ALL_LABELS")
          fi
          python sf-pipeline/scripts/pipeline_config.py promote-plan "${args[@]}" --github-output --fail-on-error

      # Whoever added the label sees why on the PR, not only in the Actions log.
      - name: Explain a rejected promotion label
        if: failure() && steps.targets.outcome == 'failure' && github.event.action == 'labeled'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.pr.outputs.number }}
          LABEL: ${{ github.event.label.name }}
          ERRORS: ${{ steps.targets.outputs.errors }}
        run: |
          reasons="$(jq -r '.[] | "- " + .' <<<"${ERRORS:-[]}" 2>/dev/null || true)"
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "⛔ \`${LABEL}\` was not applied, so the label has been removed:

          ${reasons:-- see the SF Promote run for details}" || true
          python3 sf-pipeline/scripts/gh_helpers.py remove-label --pr "$PR" --label "$LABEL" || true

  promote:
    name: Promote to ${{ matrix.target.env }}
    needs: plan
    if: needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.plan.outputs.targets) }}
    steps:
      - name: Open promotion PR
        env:
          GH_TOKEN: ${{ secrets[fromJSON(needs.plan.outputs.cfg).pat_secret] }}
          PAT_SECRET: ${{ fromJSON(needs.plan.outputs.cfg).pat_secret }}
          PREFIX: ${{ fromJSON(needs.plan.outputs.cfg).promote_branch_prefix }}
          APPROVAL_LABEL: ${{ fromJSON(needs.plan.outputs.cfg).approval_label }}
          PR: ${{ needs.plan.outputs.pr }}
          HEAD_SHA: ${{ needs.plan.outputs.head_sha }}
          TITLE: ${{ needs.plan.outputs.title }}
          BASE_ENV: ${{ needs.plan.outputs.base_env }}
          TARGET_ENV: ${{ matrix.target.env }}
          TARGET_BRANCH: ${{ matrix.target.branch }}
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "::error title=SF Promote::Secret ${PAT_SECRET} is not set (needed so PR checks run on the new PR)."
            exit 1
          fi
          repo="$GITHUB_REPOSITORY"
          branch="${PREFIX}${TARGET_ENV}/pr-${PR}"

          url="$(gh pr list --repo "$repo" --head "$branch" --base "$TARGET_BRANCH" --state open \
            --json url --jq '.[0].url // empty')"
          if [ -n "$url" ]; then
            # Leave the branch alone: it may carry a conflict resolution.
            echo "Promotion PR already open: $url"
          else
            # The branch is the exact content that was merged before, plus an empty
            # "promote" commit: each promotion PR gets its own head SHA, so its
            # sf-approval / deploy-<env> statuses can't leak to or from another PR.
            tree="$(gh api "repos/${repo}/git/commits/${HEAD_SHA}" --jq .tree.sha)"
            promo="$(gh api -X POST "repos/${repo}/git/commits" -f message="Promote #${PR} to ${TARGET_ENV}" \
              -f tree="$tree" -f "parents[]=${HEAD_SHA}" --jq .sha)"
            # Reset a leftover branch from a closed promotion PR, or create it.
            if gh api "repos/${repo}/git/ref/heads/${branch}" > /dev/null 2>&1; then
              gh api -X PATCH "repos/${repo}/git/refs/heads/${branch}" -f sha="$promo" -F force=true > /dev/null
            else
              gh api -X POST "repos/${repo}/git/refs" -f ref="refs/heads/${branch}" -f sha="$promo" > /dev/null
            fi
            title="$TITLE"
            while [[ "$title" == "[promote → "*"] "* ]]; do title="${title#*] }"; done
            body="Promotes #${PR} (\`${HEAD_SHA:0:7}\`) from \`${BASE_ENV}\` to \`${TARGET_ENV}\`.

          Opened by the SF Promote workflow; SF PR Validation checks it against the \`${TARGET_ENV}\` org.
          Add the \`${APPROVAL_LABEL}\` label to approve it (it squash-merges itself once checks pass)."
            url="$(gh pr create --repo "$repo" --base "$TARGET_BRANCH" --head "$branch" \
              --title "[promote → ${TARGET_ENV}] ${title}" --body "$body")"
            echo "Opened $url"
            gh pr comment "$PR" --repo "$repo" --body "🚚 Promotion to \`${TARGET_ENV}\` opened: ${url}" || true
          fi
          echo "- \`${TARGET_ENV}\`: ${url}" >> "$GITHUB_STEP_SUMMARY"

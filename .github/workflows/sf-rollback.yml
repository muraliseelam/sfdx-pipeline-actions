name: SF Rollback

# Undo a change by reverting it. The revert is an ordinary pull request, so it
# is validated, approved, deployed and audited exactly like any other change;
# nothing is force-deployed behind the pipeline's back.
#
#   target = production (default): revert a commit or merged PR that is already
#     in the baseline branch (main). The revert branch is cut from main and the PR
#     goes into the first environment, then is promoted and released as usual.
#   target = <env>: revert a change that is only in that environment branch (not
#     released yet). The PR goes straight into that branch.
#
# Note: a revert removes metadata from the branch. Components the reverted change
# ADDED are deleted from orgs only when the revert reaches production (the release
# delta then contains the deletion); cumulative env deploys don't delete them.

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Merged PR to revert (or leave blank and give a commit)
        type: string
        default: ""
      ref:
        description: Commit SHA to revert (used when pr_number is blank)
        type: string
        default: ""
      target:
        description: "production (change is in main) or an environment key (unreleased change)"
        type: string
        default: production

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: sf-rollback-${{ inputs.pr_number || inputs.ref }}
  cancel-in-progress: false

jobs:
  revert:
    name: Open revert PR
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Load config
        id: cfg
        uses: ./.github/actions/load-config
        with:
          environment: ${{ inputs.target != 'production' && inputs.target || '' }}
          production: ${{ inputs.target == 'production' && 'true' || 'false' }}

      - name: Revert
        env:
          GH_TOKEN: ${{ secrets[fromJSON(steps.cfg.outputs.json).pat_secret] }}
          PAT_SECRET: ${{ fromJSON(steps.cfg.outputs.json).pat_secret }}
          FOUND: ${{ steps.cfg.outputs.found }}
          TARGET: ${{ inputs.target }}
          PR_NUMBER: ${{ inputs.pr_number }}
          REF_IN: ${{ inputs.ref }}
          BASELINE: ${{ fromJSON(steps.cfg.outputs.json).baseline_branch }}
          ENTRY_BRANCH: ${{ fromJSON(steps.cfg.outputs.json).entry_branch }}
          ENV_BRANCH: ${{ fromJSON(steps.cfg.outputs.json).branch }}
          PROMOTE_PREFIX: ${{ fromJSON(steps.cfg.outputs.json).promote_branch_prefix }}
          APPROVAL_LABEL: ${{ fromJSON(steps.cfg.outputs.json).approval_label }}
          ACTOR: ${{ github.actor }}
          ACTOR_ID: ${{ github.actor_id }}
        run: |
          set -euo pipefail
          [ -n "$GH_TOKEN" ] || { echo "::error title=SF Rollback::Secret ${PAT_SECRET} is not set (the revert PR must trigger validation)"; exit 1; }
          [ "$FOUND" = "true" ] || { echo "::error title=SF Rollback::'${TARGET}' is not 'production' or an environment key"; exit 1; }

          if [ -n "$PR_NUMBER" ]; then
            sha="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq 'select(.merged_at != null) | .merge_commit_sha')"
            [ -n "$sha" ] || { echo "::error title=SF Rollback::PR #${PR_NUMBER} isn't merged"; exit 1; }
            what="PR #${PR_NUMBER}"
          elif [ -n "$REF_IN" ]; then
            sha="$REF_IN"; what="commit ${REF_IN:0:8}"
          else
            echo "::error title=SF Rollback::Give a pr_number or a ref"; exit 1
          fi
          git cat-file -e "${sha}^{commit}" 2>/dev/null || { echo "::error title=SF Rollback::commit ${sha} not found"; exit 1; }
          short="${sha:0:8}"

          if [ "$TARGET" = "production" ]; then
            git merge-base --is-ancestor "$sha" "origin/${BASELINE}" \
              || { echo "::error title=SF Rollback::${what} isn't in ${BASELINE}; for an unreleased change set target to its environment"; exit 1; }
            base="$BASELINE"; pr_base="$ENTRY_BRANCH"; branch="rollback/${short}"
          else
            git merge-base --is-ancestor "$sha" "origin/${ENV_BRANCH}" \
              || { echo "::error title=SF Rollback::${what} isn't in ${ENV_BRANCH}"; exit 1; }
            # Non-entry env branches only accept promotion branches (PR routing).
            base="$ENV_BRANCH"; pr_base="$ENV_BRANCH"; branch="${PROMOTE_PREFIX}${TARGET}/rollback-${short}"
          fi

          # The revert is the change of whoever ran the rollback, so it carries their name.
          name="$(gh api "users/${ACTOR}" --jq '.name // .login' 2>/dev/null)" || name=""
          git config user.name "${name:-$ACTOR}"
          git config user.email "${ACTOR_ID}+${ACTOR}@users.noreply.github.com"
          git checkout -q -B "$branch" "origin/${base}"
          mflag=()
          if [ "$(git rev-list --parents -n 1 "$sha" | wc -w)" -ge 3 ]; then mflag=(-m 1); fi
          if ! git revert --no-edit "${mflag[@]}" "$sha"; then
            git revert --abort || true
            echo "::error title=SF Rollback::Reverting ${what} conflicts with ${base}. Revert it by hand on a branch from ${base}."
            exit 1
          fi
          git push -q "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/${branch}" --force-with-lease

          flow="validation → \`${APPROVAL_LABEL}\` → deploy"
          if [ "$TARGET" = "production" ]; then flow="${flow} → promotion → release"; fi
          body="Reverts ${what} (\`${short}\`), cut from \`${base}\`.

          This rollback flows through the pipeline like any change: ${flow}.
          Opened by the SF Rollback workflow."
          url="$(gh pr create --repo "$GITHUB_REPOSITORY" --base "$pr_base" --head "$branch" \
            --title "Rollback: revert ${what}" --body "$body")"
          echo "Opened $url"
          {
            echo "### ⏪ Rollback PR opened"
            echo
            echo "- Reverting: \`${sha}\` (${what})"
            echo "- PR: ${url} (into \`${pr_base}\`)"
          } >> "$GITHUB_STEP_SUMMARY"

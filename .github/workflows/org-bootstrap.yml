name: Org Bootstrap

# Reusable workflow to onboard a Salesforce org end-to-end from CI, with no local
# machine required. Call it from a consuming repo (or run it in the central repo
# for testing). Auth uses an admin SFDX auth URL secret so it's fully hands-off.
#
# Prerequisites in the CALLER:
#   secrets:
#     SFDX_AUTH_URL   - `sf org display --verbose` "Sfdx Auth Url" for an ADMIN
#                       of the target org (one-time; used only to deploy the app).
#                       It names ONE org: replace it before bootstrapping the next.
#     BOOTSTRAP_TOKEN  - a PAT with admin on the caller repo, to write Environment
#                        secrets (GITHUB_TOKEN cannot). It also checks out the kit
#                        from this repo, so for a private copy it needs read here.
#   Any workflow a writer pushes can read repository secrets, so delete both once
#   the last org is bootstrapped.
#
# Orgs that refuse new Connected Apps get the same app as an External Client App
# (sf-setup/README.md); the four secrets written are the same either way.
on:
  workflow_call:
    inputs:
      environment:
        description: GitHub Environment to populate (must match a gh_environment in pipeline.config.yml)
        required: true
        type: string
      instance_url:
        description: Login URL for the org
        required: true
        type: string
      integration_username:
        description: Integration user to create/authenticate as
        required: true
        type: string
      contact_email:
        description: Contact email for the Connected App + integration user
        required: true
        type: string
      target_repo:
        description: owner/repo whose Environment secrets get written
        required: true
        type: string
    secrets:
      SFDX_AUTH_URL:
        required: true
      BOOTSTRAP_TOKEN:
        required: true

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      # A reusable workflow runs in the CALLER's workspace: a plain checkout
      # fetches the consumer repo, which has no sf-setup/. Check the kit out of
      # this repo instead, at the ref the caller pinned. SELF is an internal
      # reference like every `uses:` here, so cut-release.sh rewrites its @ref to
      # the release tag and a consumer on @v1 runs the v1 kit.
      - name: Locate the central bootstrap kit
        id: kit
        env:
          SELF: muraliseelam/sfdx-pipeline-actions/.github/workflows/org-bootstrap.yml@main
        run: |
          echo "repo=${SELF%%/.github/*}" >> "$GITHUB_OUTPUT"
          echo "ref=${SELF##*@}" >> "$GITHUB_OUTPUT"

      - name: Check out the bootstrap kit
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.kit.outputs.repo }}
          ref: ${{ steps.kit.outputs.ref }}
          path: .sf-bootstrap-kit
          token: ${{ secrets.BOOTSTRAP_TOKEN }}
          persist-credentials: false

      - name: Install Salesforce CLI
        run: npm install --global @salesforce/cli

      - name: Run org bootstrap
        env:
          SFDX_AUTH_URL: ${{ secrets.SFDX_AUTH_URL }}
          GH_TOKEN: ${{ secrets.BOOTSTRAP_TOKEN }}
          INSTANCE_URL: ${{ inputs.instance_url }}
          TARGET_REPO: ${{ inputs.target_repo }}
          TARGET_ENV: ${{ inputs.environment }}
          INT_USERNAME: ${{ inputs.integration_username }}
          CONTACT_EMAIL: ${{ inputs.contact_email }}
        run: |
          bash .sf-bootstrap-kit/sf-setup/scripts/bootstrap-org.sh \
            --org-alias bootstrap-target \
            --instance-url "$INSTANCE_URL" \
            --repo "$TARGET_REPO" \
            --env "$TARGET_ENV" \
            --int-username "$INT_USERNAME" \
            --contact-email "$CONTACT_EMAIL" \
            --key-dir "$RUNNER_TEMP/sf-bootstrap-keys" \
            --login jwt

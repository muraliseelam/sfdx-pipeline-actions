name: Pipeline notification (chat)
description: >-
  Post a Markdown message to a team chat when notifications.chat.enabled is
  true: Slack, Microsoft Teams, Webex, any JSON webhook, or a token-based chat
  API (provider auto-detected from the webhook URL). Never fails the job: a
  delivery problem is reported as a warning.

inputs:
  enabled:
    description: "'true' to send (pass fromJSON(<config json>).chat_enabled)."
    required: true
  message:
    description: Markdown message body.
    required: true
  provider:
    description: "auto | slack | teams | webex | generic | api"
    required: false
    default: auto
  webhook-url:
    description: Incoming-webhook URL (secret value).
    required: false
    default: ""
  api-url:
    description: Chat API endpoint for token-based providers (secret value).
    required: false
    default: ""
  api-token:
    description: Bot/API token for token-based providers (secret value).
    required: false
    default: ""
  channel-id:
    description: Channel or room id for token-based providers (secret value).
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Send chat message
      if: inputs.enabled == 'true'
      shell: bash
      env:
        CHAT_PROVIDER: ${{ inputs.provider }}
        CHAT_WEBHOOK_URL: ${{ inputs.webhook-url }}
        CHAT_API_URL: ${{ inputs.api-url }}
        CHAT_API_TOKEN: ${{ inputs.api-token }}
        CHAT_CHANNEL_ID: ${{ inputs.channel-id }}
        MESSAGE: ${{ inputs.message }}
        TMPDIR: ${{ runner.temp }}
      run: bash "$GITHUB_WORKSPACE/sf-pipeline/scripts/notify.sh" "$MESSAGE"

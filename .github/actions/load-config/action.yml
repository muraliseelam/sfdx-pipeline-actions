name: Load pipeline config
description: >-
  Set up Python + PyYAML and resolve sf-pipeline/pipeline.config.yml for one
  environment (by key, branch, label or the production flag). Exposes the flat
  view as a JSON string; read fields with fromJSON(steps.<id>.outputs.json).<field>.
  Requires the repository to be checked out (sparse checkout of .github/actions
  and sf-pipeline is enough).

inputs:
  environment:
    description: Environment key from pipeline.config.yml (e.g. int).
    required: false
    default: ""
  branch:
    description: Resolve the environment whose branch matches this name.
    required: false
    default: ""
  label:
    description: "Resolve the environment named by a deploy:<env> or promote:<env> label."
    required: false
    default: ""
  production:
    description: "'true' to resolve the production environment."
    required: false
    default: "false"
  config-file:
    description: Path to the pipeline config, relative to the workspace.
    required: false
    default: sf-pipeline/pipeline.config.yml
  python-version:
    description: Python used to run the pipeline helper scripts.
    required: false
    default: "3.12"

outputs:
  found:
    description: "'true' when an environment matched."
    value: ${{ steps.resolve.outputs.found }}
  env:
    description: Environment key that matched (empty when none).
    value: ${{ steps.resolve.outputs.env }}
  matched-by:
    description: How the environment matched (name, branch, deploy, promote, production).
    value: ${{ steps.resolve.outputs.matched_by }}
  json:
    description: Flat environment + global settings as a compact JSON object of strings.
    value: ${{ steps.resolve.outputs.json }}

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install helper dependencies
      shell: bash
      run: |
        if ! python -c "import yaml" 2>/dev/null; then
          python -m pip install --disable-pip-version-check --quiet \
            -r "$GITHUB_WORKSPACE/sf-pipeline/scripts/requirements.txt"
        fi

    - name: Resolve environment
      id: resolve
      shell: bash
      env:
        SF_PIPELINE_CONFIG: ${{ github.workspace }}/${{ inputs.config-file }}
        IN_ENV: ${{ inputs.environment }}
        IN_BRANCH: ${{ inputs.branch }}
        IN_LABEL: ${{ inputs.label }}
        IN_PRODUCTION: ${{ inputs.production }}
      run: |
        set -euo pipefail
        args=()
        if [ "$IN_PRODUCTION" = "true" ]; then args=(--production)
        elif [ -n "$IN_ENV" ]; then args=(--name "$IN_ENV")
        elif [ -n "$IN_BRANCH" ]; then args=(--branch "$IN_BRANCH")
        elif [ -n "$IN_LABEL" ]; then args=(--label "$IN_LABEL")
        fi
        python "$GITHUB_WORKSPACE/sf-pipeline/scripts/pipeline_config.py" env "${args[@]}" --github-output

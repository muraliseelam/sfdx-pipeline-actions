name: Salesforce delta deploy
description: >-
  Core pipeline step. Computes the prod-relative delta with sfdx-git-delta
  (from merge-base(origin/<baseline>, HEAD) to HEAD), builds package.xml +
  destructiveChanges.xml, resolves the Apex test level, then runs a check-only
  validation, a real deploy, or a quick deploy of a validated job. Always
  renders the pipeline report (job summary, optional PR comment, artifact) and
  fails when the deploy or the coverage gate fails. Run sf-setup first in the
  same job, after checking out with fetch-depth 0.

inputs:
  environment:
    description: Environment key from pipeline.config.yml (e.g. int).
    required: true
  mode:
    description: "validate (check-only), deploy (real), or quick (quick-deploy a validated job-id)."
    required: false
    default: validate
  delta-to:
    description: Commit-ish to deploy. Defaults to the checked-out HEAD.
    required: false
    default: HEAD
  delta-from:
    description: Override the delta base. Defaults to merge-base(origin/<baseline_branch>, delta-to).
    required: false
    default: ""
  job-id:
    description: Validated deploy job ID (mode quick only).
    required: false
    default: ""
  pr-number:
    description: When set, the report is upserted as a comment on this PR.
    required: false
    default: ""
  github-token:
    description: Token used to comment on the PR.
    required: false
    default: ${{ github.token }}
  bypass:
    description: Reason an admin bypass is in effect (empty = none). Waives the coverage gate only.
    required: false
    default: ""

outputs:
  status:
    description: success | failed | skipped (no deployable metadata).
    value: ${{ steps.final.outputs.status }}
  has-changes:
    description: "'true' when the delta contains deployable or destructive metadata."
    value: ${{ steps.delta.outputs.has_changes }}
  test-level:
    description: Apex test level used.
    value: ${{ steps.tests.outputs.test_level }}
  tests:
    description: Space-separated test classes (RunSpecifiedTests).
    value: ${{ steps.tests.outputs.tests }}
  untested:
    description: Comma-separated changed Apex with no resolvable test class.
    value: ${{ steps.tests.outputs.untested }}
  job-id:
    description: Salesforce deploy/validation job ID.
    value: ${{ steps.report.outputs.job_id }}
  error-name:
    description: sf CLI error name when the command failed (e.g. CannotQuickDeployError).
    value: ${{ steps.run.outputs.error_name }}
  coverage-ok:
    description: "'true' when every changed class/trigger met coverage_threshold."
    value: ${{ steps.report.outputs.coverage_ok }}
  overall-coverage:
    description: Line coverage (%) across classes exercised by this run.
    value: ${{ steps.report.outputs.overall_coverage }}
  report-file:
    description: Path of the Markdown report.
    value: ${{ steps.prep.outputs.work }}/report.md

runs:
  using: composite
  steps:
    - name: Load config
      id: cfg
      uses: ./.github/actions/load-config
      with:
        environment: ${{ inputs.environment }}

    - name: Prepare
      id: prep
      shell: bash
      env:
        FOUND: ${{ steps.cfg.outputs.found }}
        ENV_NAME: ${{ inputs.environment }}
        MODE: ${{ inputs.mode }}
        JOB_ID: ${{ inputs.job-id }}
      run: |
        set -euo pipefail
        if [ "$FOUND" != "true" ]; then
          echo "::error title=deploy::Environment '$ENV_NAME' is not defined in sf-pipeline/pipeline.config.yml"
          exit 1
        fi
        case "$MODE" in
          validate|deploy) ;;
          quick) [ -n "$JOB_ID" ] || { echo "::error title=deploy::mode quick needs job-id"; exit 1; } ;;
          *) echo "::error title=deploy::mode must be validate, deploy or quick (got '$MODE')"; exit 1 ;;
        esac
        work="$RUNNER_TEMP/sf-pipeline/${ENV_NAME}-${MODE}"
        rm -rf "$work" && mkdir -p "$work"
        echo "work=$work" >> "$GITHUB_OUTPUT"

    - name: Compute delta (sfdx-git-delta)
      id: delta
      if: inputs.mode != 'quick'
      shell: bash
      env:
        BASELINE: ${{ fromJSON(steps.cfg.outputs.json).baseline_branch }}
        SOURCE_PATH: ${{ fromJSON(steps.cfg.outputs.json).source_path }}
        OUT_DIR: ${{ fromJSON(steps.cfg.outputs.json).delta_output_dir }}
        DELTA_FROM: ${{ inputs.delta-from }}
        DELTA_TO: ${{ inputs.delta-to }}
        ORG_ALIAS: ${{ fromJSON(steps.cfg.outputs.json).org_alias }}
        # The env branch's previous head: a merge's push, or the base of a PR into an env branch.
        SINCE: >-
          ${{ inputs.mode != 'quick' && (github.event_name == 'push' && github.event.before ||
              github.event_name == 'pull_request' && github.event.pull_request.base.sha) || '' }}
        WORK: ${{ steps.prep.outputs.work }}
      run: |
        set -euo pipefail
        git fetch --no-tags --quiet origin "+refs/heads/${BASELINE}:refs/remotes/origin/${BASELINE}"
        if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
          echo "::notice title=deploy::Shallow clone; fetching full history for the delta"
          git fetch --no-tags --quiet --unshallow origin
        fi

        to_sha="$(git rev-parse --verify "${DELTA_TO}^{commit}")"
        if [ -n "$DELTA_FROM" ]; then
          from_sha="$(git rev-parse --verify "${DELTA_FROM}^{commit}")"
        elif ! from_sha="$(git merge-base "origin/${BASELINE}" "$to_sha")"; then
          echo "::error title=deploy::No merge-base between origin/${BASELINE} and ${to_sha}"
          exit 1
        fi

        # Same as `sf sgd source delta --from origin/<baseline> --merge-base`, but the
        # base SHA is kept for the report. Every env gets the identical prod-relative artifact.
        rm -rf "$OUT_DIR" && mkdir -p "$OUT_DIR"
        if ! sf sgd source delta \
              --from "$from_sha" --to "$to_sha" \
              --source-dir "$SOURCE_PATH" --output-dir "$OUT_DIR" \
              --ignore-whitespace --json > "$WORK/sgd.json"; then
          cat "$WORK/sgd.json" || true
          echo "::error title=sfdx-git-delta::Delta generation failed for ${from_sha:0:7}..${to_sha:0:7}"
          exit 1
        fi
        jq -r '(.result.warnings // .warnings // [])[]' "$WORK/sgd.json" 2>/dev/null \
          | sed 's/^/::warning title=sfdx-git-delta::/' || true

        pkg="$OUT_DIR/package/package.xml"
        destructive="$OUT_DIR/destructiveChanges/destructiveChanges.xml"
        # A change built on top of the env branch (a merge, or a rollback cut from it) also
        # deletes what it removed from that branch, even if it never reached the baseline.
        # Changes cut from the baseline don't have the env head as an ancestor, so this
        # never deletes other work that's only on the env branch.
        extra=""
        if [ -n "$SINCE" ] && since="$(git rev-parse --verify --quiet "${SINCE}^{commit}")" \
            && [ "$since" != "$from_sha" ] && git merge-base --is-ancestor "$since" "$to_sha"; then
          mkdir -p "$WORK/since"   # sgd needs an existing output dir
          if sf sgd source delta --from "$since" --to "$to_sha" --source-dir "$SOURCE_PATH" \
                --output-dir "$WORK/since" --ignore-whitespace --json > "$WORK/sgd-since.json"; then
            extra="$WORK/since/destructiveChanges/destructiveChanges.xml"
            [ -f "$extra" ] && grep -q "<types>" "$extra" || extra=""
          else
            cat "$WORK/sgd-since.json" || true
            echo "::warning title=sfdx-git-delta::Couldn't list what ${since:0:7}..${to_sha:0:7} removed; only deletions relative to ${BASELINE} are deployed"
          fi
        fi

        # Deleting something the org doesn't have fails the deploy ("No ApexClass named X
        # found"); the delete's intent is already met, so drop those members and say so.
        if [ -n "$extra" ] || { [ -f "$destructive" ] && grep -q "<types>" "$destructive"; }; then
          merge=()
          if [ -n "$extra" ]; then merge=(--merge-from "$extra"); fi
          python "$GITHUB_WORKSPACE/sf-pipeline/scripts/destructive_prune.py" \
            --destructive "$destructive" --org "$ORG_ALIAS" --notes "$WORK/pruned.md" "${merge[@]}"
        fi
        has_pkg=false
        has_destructive=false
        if [ -f "$pkg" ] && grep -q "<types>" "$pkg"; then has_pkg=true; fi
        if [ -f "$destructive" ] && grep -q "<types>" "$destructive"; then has_destructive=true; fi
        has_changes=false
        if [ "$has_pkg" = true ] || [ "$has_destructive" = true ]; then has_changes=true; fi

        {
          echo "from=$from_sha"
          echo "to=$to_sha"
          echo "package=$pkg"
          echo "destructive=$destructive"
          echo "has_package=$has_pkg"
          echo "has_destructive=$has_destructive"
          echo "has_changes=$has_changes"
        } >> "$GITHUB_OUTPUT"

        echo "Delta ${from_sha:0:7}..${to_sha:0:7} (origin/${BASELINE} merge-base): deploy=$has_pkg destructive=$has_destructive"
        if [ "$has_pkg" = true ]; then echo "--- package.xml"; cat "$pkg"; fi
        if [ "$has_destructive" = true ]; then echo "--- destructiveChanges.xml"; cat "$destructive"; fi

    - name: Dependency lint (deleted metadata still referenced?)
      id: deplint
      if: >-
        inputs.mode != 'quick' && steps.delta.outputs.has_changes == 'true' &&
        fromJSON(steps.cfg.outputs.json).dependency_lint == 'true'
      shell: bash
      env:
        OUT_DIR: ${{ fromJSON(steps.cfg.outputs.json).delta_output_dir }}
        SOURCE_PATH: ${{ fromJSON(steps.cfg.outputs.json).source_path }}
        FROM_SHA: ${{ steps.delta.outputs.from }}
        WORK: ${{ steps.prep.outputs.work }}
      run: |
        set -uo pipefail
        python "$GITHUB_WORKSPACE/sf-pipeline/scripts/dependency_lint.py" --dir "$OUT_DIR" \
          --source-root "$SOURCE_PATH" --baseline "$FROM_SHA" | tee "$WORK/dependency-lint.txt"
        if [ "${PIPESTATUS[0]}" -ne 0 ]; then
          # Same fail-fast shape as a missing test: nothing is sent to the org, the report explains why.
          python - "$WORK/dependency-lint.txt" "$WORK/deploy-result.json" <<'EOF'
        import json, sys
        lines = open(sys.argv[1], encoding="utf-8").read().splitlines()
        errs = [l.split("::error::[dependency-lint] ", 1)[1] for l in lines if l.startswith("::error::[dependency-lint] ")]
        json.dump({
            "status": 1, "name": "DependencyLintError", "synthetic": True,
            "message": "Metadata that is being deleted or changed is still referenced elsewhere in the source; "
                       "nothing was deployed. Delete the dependents too, or keep the component.",
            "result": {"status": "Failed", "success": False, "numberComponentErrors": len(errs),
                       "details": {"componentFailures": [
                           {"componentType": "Dependency", "fullName": "-", "problemType": "Error", "problem": e}
                           for e in errs]}},
        }, open(sys.argv[2], "w", encoding="utf-8"), indent=2)
        EOF
          echo "blocked=true" >> "$GITHUB_OUTPUT"
        fi
        exit 0

    - name: Profiles / permission sets (incremental)
      if: >-
        inputs.mode != 'quick' && steps.delta.outputs.has_package == 'true' &&
        steps.deplint.outputs.blocked != 'true' &&
        fromJSON(steps.cfg.outputs.json).profiles_mode == 'incremental'
      shell: bash
      env:
        PKG: ${{ steps.delta.outputs.package }}
        SOURCE_PATH: ${{ fromJSON(steps.cfg.outputs.json).source_path }}
        FROM_SHA: ${{ steps.delta.outputs.from }}
        WORK: ${{ steps.prep.outputs.work }}
      run: |
        # Rewrites changed profiles / permission sets in the (ephemeral) checkout so only
        # the entries added or changed since the production baseline are deployed.
        python "$GITHUB_WORKSPACE/sf-pipeline/scripts/profiles.py" --package "$PKG" --source-root "$SOURCE_PATH" \
          --mode incremental --baseline "$FROM_SHA" --summary-out "$WORK/profiles.md"

    - name: Resolve Apex test level
      id: tests
      if: >-
        inputs.mode != 'quick' && steps.delta.outputs.has_changes == 'true' &&
        steps.deplint.outputs.blocked != 'true'
      shell: bash
      env:
        ENV_NAME: ${{ inputs.environment }}
        PKG: ${{ steps.delta.outputs.package }}
        WORK: ${{ steps.prep.outputs.work }}
      run: |
        set -euo pipefail
        python "$GITHUB_WORKSPACE/sf-pipeline/scripts/specified_tests.py" \
          --package "$PKG" --env "$ENV_NAME" \
          --out "$WORK/test-plan.json" \
          --synthetic-result "$WORK/deploy-result.json" \
          --github-output --annotate

    - name: Run sf project deploy (${{ inputs.mode }})
      id: run
      if: >-
        inputs.mode == 'quick' ||
        (steps.delta.outputs.has_changes == 'true' && steps.tests.outputs.untested == '' &&
         steps.deplint.outputs.blocked != 'true')
      shell: bash
      env:
        MODE: ${{ inputs.mode }}
        ORG_ALIAS: ${{ fromJSON(steps.cfg.outputs.json).org_alias }}
        WAIT: ${{ fromJSON(steps.cfg.outputs.json).wait_minutes }}
        IGNORE_WARNINGS: ${{ fromJSON(steps.cfg.outputs.json).ignore_warnings }}
        PKG: ${{ steps.delta.outputs.package }}
        DESTRUCTIVE: ${{ steps.delta.outputs.destructive }}
        HAS_DESTRUCTIVE: ${{ steps.delta.outputs.has_destructive }}
        TEST_LEVEL: ${{ steps.tests.outputs.test_level }}
        TESTS: ${{ steps.tests.outputs.tests }}
        JOB_ID: ${{ inputs.job-id }}
        WORK: ${{ steps.prep.outputs.work }}
      run: |
        # GitHub runs bash with -e; turn it off so a failed deploy still records its
        # result. The report and Finalize steps decide pass/fail.
        set +e -u
        result="$WORK/deploy-result.json"
        args=(--target-org "$ORG_ALIAS" --wait "$WAIT" --json)
        if [ "$MODE" = quick ]; then
          cmd=(sf project deploy quick --job-id "$JOB_ID")
        else
          # package.xml is always written by sgd (empty for destructive-only deltas).
          args+=(--manifest "$PKG" --test-level "$TEST_LEVEL")
          if [ "$HAS_DESTRUCTIVE" = true ]; then args+=(--post-destructive-changes "$DESTRUCTIVE"); fi
          for t in $TESTS; do args+=(--tests "$t"); done
          if [ "$TEST_LEVEL" != NoTestRun ]; then
            args+=(--coverage-formatters json-summary --results-dir "$WORK/results")
          fi
          if [ "$IGNORE_WARNINGS" = true ]; then args+=(--ignore-warnings); fi
          # --ignore-conflicts: a fresh runner has no source-tracking state, so orgs with
          # tracking (scratch orgs, tracked sandboxes) would otherwise fail every
          # `deploy start` with SourceConflictError. `deploy validate` doesn't track.
          if [ "$MODE" = deploy ]; then
            cmd=(sf project deploy start --ignore-conflicts)
          elif [ "$TEST_LEVEL" = NoTestRun ]; then
            # `deploy validate` rejects NoTestRun; a dry-run start is the check-only equivalent.
            cmd=(sf project deploy start --dry-run --ignore-conflicts)
          else
            cmd=(sf project deploy validate)
          fi
        fi
        echo "+ ${cmd[*]} ${args[*]}"
        "${cmd[@]}" "${args[@]}" > "$result"
        rc=$?
        echo "rc=$rc" >> "$GITHUB_OUTPUT"
        echo "error_name=$(jq -r '.name // empty' "$result" 2>/dev/null)" >> "$GITHUB_OUTPUT"
        jq -r '"sf exit=\(.status // .exitCode) result=\(.result.status // .name // "unknown")"' "$result" 2>/dev/null || true

        # On failure `sf project deploy validate|start|quick --json` returns only
        # {name, message, data.deployId}. Fetch the full result (component and
        # test failures, coverage) but keep the original failure status/message.
        if ! jq -e '.result.details' "$result" > /dev/null 2>&1; then
          job="$(jq -r '.data.deployId // .result.id // empty' "$result" 2>/dev/null)"
          if [ -n "$job" ] && sf project deploy report --job-id "$job" --target-org "$ORG_ALIAS" \
                --json > "$WORK/deploy-report.json" 2>/dev/null; then
            jq -s '.[1] + {status: (.[0].status // .[0].exitCode), name: .[0].name, message: .[0].message}' \
              "$result" "$WORK/deploy-report.json" > "$WORK/merged.json" && mv "$WORK/merged.json" "$result"
            echo "Fetched full result for deploy ${job}"
          fi
        fi
        exit 0

    - name: Build pipeline report
      id: report
      if: always() && steps.prep.outcome == 'success'
      shell: bash
      env:
        ENV_NAME: ${{ inputs.environment }}
        MODE: ${{ inputs.mode }}
        ORG_ALIAS: ${{ fromJSON(steps.cfg.outputs.json).org_alias }}
        BASELINE: ${{ fromJSON(steps.cfg.outputs.json).baseline_branch }}
        SOURCE_PATH: ${{ fromJSON(steps.cfg.outputs.json).source_path }}
        THRESHOLD: ${{ fromJSON(steps.cfg.outputs.json).coverage_threshold }}
        FROM_SHA: ${{ steps.delta.outputs.from }}
        TO_SHA: ${{ steps.delta.outputs.to }}
        HAS_CHANGES: ${{ steps.delta.outputs.has_changes }}
        PKG: ${{ steps.delta.outputs.package }}
        DESTRUCTIVE: ${{ steps.delta.outputs.destructive }}
        WORK: ${{ steps.prep.outputs.work }}
        BYPASS: ${{ inputs.bypass }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        set -euo pipefail
        args=(--env "$ENV_NAME" --org "$ORG_ALIAS" --mode "$MODE" --threshold "$THRESHOLD"
              --output "$WORK/report.md" --run-url "$RUN_URL" --github-output)
        if [ -n "$BYPASS" ]; then args+=(--bypass "$BYPASS"); fi
        if [ -n "$TO_SHA" ]; then args+=(--from "$FROM_SHA" --to "$TO_SHA" --baseline "$BASELINE"); fi
        if [ "$HAS_CHANGES" = false ]; then args+=(--no-changes); fi
        if [ -f "$WORK/test-plan.json" ]; then args+=(--plan "$WORK/test-plan.json"); fi
        if [ -f "$WORK/deploy-result.json" ]; then args+=(--result "$WORK/deploy-result.json"); fi
        if [ -n "$PKG" ] && [ -f "$PKG" ]; then args+=(--package "$PKG"); fi
        if [ -n "$DESTRUCTIVE" ] && [ -f "$DESTRUCTIVE" ]; then args+=(--destructive "$DESTRUCTIVE"); fi
        if [ -d "$WORK/results" ]; then args+=(--coverage-dir "$WORK/results"); fi
        # --annotate puts compile errors and failing test lines on the PR's changed files.
        python "$GITHUB_WORKSPACE/sf-pipeline/scripts/deploy_report.py" "${args[@]}" --quiet --annotate "$SOURCE_PATH"
        for extra in pruned profiles; do
          if [ -f "$WORK/$extra.md" ]; then printf '\n%s\n' "$(cat "$WORK/$extra.md")" >> "$WORK/report.md"; fi
        done
        cat "$WORK/report.md" >> "$GITHUB_STEP_SUMMARY"

    - name: Comment report on PR
      if: always() && inputs.pr-number != '' && steps.report.outcome == 'success'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        PR_NUMBER: ${{ inputs.pr-number }}
        MARKER: ${{ steps.report.outputs.marker }}
        WORK: ${{ steps.prep.outputs.work }}
      run: |
        python3 "$GITHUB_WORKSPACE/sf-pipeline/scripts/gh_helpers.py" upsert-comment \
          --pr "$PR_NUMBER" --marker "$MARKER" --body-file "$WORK/report.md" \
          || echo "::warning title=deploy::Could not post the report comment on PR #$PR_NUMBER"

    - name: Upload deploy artifacts
      if: always() && steps.prep.outcome == 'success'
      uses: actions/upload-artifact@v7
      with:
        name: sf-${{ inputs.environment }}-${{ inputs.mode }}-${{ github.job }}-${{ github.run_attempt }}
        path: |
          ${{ steps.prep.outputs.work }}
          ${{ github.workspace }}/${{ fromJSON(steps.cfg.outputs.json).delta_output_dir }}
        if-no-files-found: ignore
        retention-days: 14

    - name: Finalize
      id: final
      if: always() && steps.prep.outcome == 'success'
      shell: bash
      env:
        ENV_NAME: ${{ inputs.environment }}
        MODE: ${{ inputs.mode }}
        REPORT_STATUS: ${{ steps.report.outputs.status }}
        UNTESTED: ${{ steps.tests.outputs.untested }}
      run: |
        status="${REPORT_STATUS:-failed}"
        echo "status=$status" >> "$GITHUB_OUTPUT"
        echo "Salesforce $MODE for $ENV_NAME: $status"
        if [ "$status" = failed ]; then
          if [ -n "$UNTESTED" ]; then
            echo "::error title=Missing Apex tests::No test class for: $UNTESTED. Deploy not attempted (no fallback to RunLocalTests)."
          fi
          echo "::error title=Salesforce $MODE failed ($ENV_NAME)::See the Salesforce Pipeline Report in the job summary."
          exit 1
        fi
